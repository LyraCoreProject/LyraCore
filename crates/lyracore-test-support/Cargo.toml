[package]
name = "lyracore-test-support"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Private Standalone fixtures shared by Core and Package integration tests."

[dependencies]
lyracore-shared = { path = "../lyracore-shared" }
rustc_lexer = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[lints]
workspace = true
