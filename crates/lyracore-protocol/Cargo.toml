[package]
name = "lyracore-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "WoW 1.12.1 packet encoding and decoding for the LyraCore Module."

[[example]]
name = "benilla_inventory"
test = true

[dependencies]
lyracore-shared.workspace = true
anyhow = "1"
sha1 = "0.10"
subtle = "2"
num-bigint = "0.4"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", default-features = false, features = ["vanilla", "sync"] }
wow_world_base = "0.3"

[dev-dependencies]
lyracore-conformance.workspace = true
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
lyracore-test-support.workspace = true
benilla-protocol = { git = "https://github.com/samwhosung/benilla.git", rev = "c2fc3cf304075a0fa1c9accffaf5efb99be9edfe" }
wow_srp = "0.7"

[lints]
workspace = true
