[package]
name = "lyracore-importer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "LyraCore content ETL: extracts a world slice from the operator's own client/world data."

[[bin]]
name = "lyracore-importer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
flate2 = "1"
lyracore-shared.workspace = true
lyracore-package-delta.workspace = true
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
wow-adt = "=0.7.0"
wow-m2 = "=0.7.0"
wow-mpq = "=0.7.0"
wow-wmo = "=0.7.0"
wow_dbc = { version = "0.3", features = ["vanilla"] }
# Match wow_dbc's wow_world_base version so AuraMod has the same Rust type.
wow_world_base = { version = "=0.2.0", features = ["vanilla"] }

[dev-dependencies]
lyracore-test-support.workspace = true

[lints]
workspace = true
