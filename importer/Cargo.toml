[package]
name = "lyracore-importer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "LyraCore content ETL: extracts a world slice from the operator's own client/world data."

# Native-only ETL tool: parse the operator's own cmangos classic-db dump and load a content slice
# into the live SpacetimeDB module. NEVER a dependency of the wasm module (licensing firewall: this
# ships the EXTRACTOR; the operator supplies the data, which never enters the repo — see .gitignore).
[[bin]]
name = "lyracore-importer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
lyracore-shared.workspace = true
wow-adt = "=0.7.0"
wow-m2 = "=0.7.0"
# Stream 1 (client DBC): read DBFilesClient/*.dbc out of the operator's OWN client MPQs (wow-mpq) and
# parse them (gtker wow_dbc, same crate family as the gateway's wow_world_messages/wow_srp). Both are
# pure parsers shipping ZERO Blizzard data, and native-only (NEVER deps of the wasm `module`). Pin
# wow-mpq exactly so the PatchChain API + format support can't drift under a minor bump.
wow-mpq = "=0.7.0"
wow-wmo = "=0.7.0"
wow_dbc = { version = "0.3", features = ["vanilla"] }
# The Spell.dbc importer matches on the typed `AuraMod` enum + reads `Attributes` flags off `SpellRow`.
# Those types live in wow_world_base; wow_dbc 0.3 pins it to =0.2.0, so we depend on the SAME version
# (same type instance) to name the variants by hand. Pure parser, ships ZERO Blizzard data.
wow_world_base = { version = "=0.2.0", features = ["vanilla"] }
