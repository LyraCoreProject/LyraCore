[package]
name = "lyracore-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "LyraCore edge/protocol tier: terminates the WoW client protocol, translates to/from SpacetimeDB. Holds NO game state."

# Linux truncates the process name to lyracore-gatewa in /proc/<pid>/comm.
[[bin]]
name = "lyracore-gateway"
path = "src/main.rs"

[[example]]
name = "benilla_inventory"
test = true

[dependencies]
lyracore-shared.workspace = true

wow_srp = "0.7"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", features = ["vanilla", "sync"] }
wow_world_base = "0.3"
# Match the Module and CLI SpacetimeDB version.
spacetimedb-sdk = "=2.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
anyhow = "1"
getrandom = "0.3"
libc = "0.2"
zeroize = "=1.9.0"
log = "0.4"
rustc-hash = "1.1"
flate2 = "1"
env_logger = "0.11"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
lyracore-test-support.workspace = true
benilla-protocol = { git = "https://github.com/samwhosung/benilla.git", rev = "c2fc3cf304075a0fa1c9accffaf5efb99be9edfe" }
benilla-srp = { git = "https://github.com/samwhosung/benilla.git", rev = "c2fc3cf304075a0fa1c9accffaf5efb99be9edfe" }
blake3 = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
spacetimedb-lib = "=2.7.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
dhat-heap = ["dep:dhat"]

# Mach-O cannot link the native Module host intrinsics; these tests require Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
lyracore-module = { path = "../module" }

[lints]
workspace = true
