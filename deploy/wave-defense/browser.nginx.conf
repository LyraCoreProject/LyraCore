map $http_upgrade $wave_defense_connection {
    default upgrade;
    '' close;
}

server {
    listen 159.69.88.70:80;
    server_name 159.69.88.70;
    location /.well-known/acme-challenge/ {
        root /var/www/wave-defense-acme;
    }
    location / {
        return 301 https://159.69.88.70$request_uri;
    }
}

server {
    listen 159.69.88.70:443 ssl;
    server_name 159.69.88.70;
    ssl_certificate /etc/letsencrypt/live/wave-defense-browser/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wave-defense-browser/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wave_defense_connection;
        proxy_read_timeout 1h;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
}
