[workspace]
resolver = "2"
members = [
    "conformance",
    "crates/lyracore-package-delta",
    "crates/lyracore-protocol",
    "crates/lyracore-shared",
    "crates/lyracore-test-support",
    "module",
    "importer",
]


[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# Keep this floor equal to rust-toolchain.toml; SpacetimeDB 2.14.0 requires Rust 1.97.
rust-version = "1.97.1"
repository = "https://github.com/LyraCoreProject/LyraCore"
homepage = "https://github.com/LyraCoreProject/LyraCore"
publish = false

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
wire-client = { git = "https://github.com/LyraCoreProject/wire-harness", rev = "166ecd701003b1d8538737d3f95ee0fa345d1779" }
lyracore-conformance = { path = "conformance" }
lyracore-shared = { path = "crates/lyracore-shared" }
lyracore-protocol = { path = "crates/lyracore-protocol" }
lyracore-test-support = { path = "crates/lyracore-test-support" }
lyracore-package-delta = { path = "crates/lyracore-package-delta" }

[profile.dev-reload]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.dev-reload.package.lyracore-module]
opt-level = 0

[profile.dev-reload.build-override]
opt-level = 3

# The fork builds flate2 without C zlib, which macOS cannot archive for wasm32.
[patch.crates-io]
wow_world_messages = { git = "https://github.com/LyraCoreProject/wow_world_messages", rev = "486d31cb0552c52904dcb6dda561b416f1dbc0ab" }
