[package]
name = "lyracore-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "LyraCore SpacetimeDB module: all WoW 1.12 game state and logic."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Layer 1 client-automation test reducers (module/src/debug.rs). OFF by default so a plain build and
# any production publish compile them out entirely (they set arbitrary players' HP/level/position, so
# they must never exist in prod). The test build / automation harness opts in via:
#   spacetime publish -s local --build-options='--features=debug_reducers' lyracore
# (`--build-options` is forwarded verbatim to the underlying `cargo build` for the wasm target.)
debug_reducers = []

[dependencies]
blake3 = "1"
# `unstable` enables row-level-security visibility filters (client_visibility_filter / Filter),
# which the design uses to pin per-owner tables (character, movement_event) to their owner.
# Pinned exactly (not "2.5") — the SpacetimeDB CLI/SDK/module-crate contract is a single unit (see
# gateway/Cargo.toml's spacetimedb-sdk/-lib pins and scripts/preflight.sh's CLI-version check); a
# minor bump here can silently drift the module ahead of what `spacetime` on PATH can publish.
spacetimedb = { version = "=2.7.1", features = ["unstable"] }
lyracore-shared.workspace = true
# The Package Delta artifact and the claim conflict tracer (src/package_import.rs). Pure and
# deterministic — no IO, no clock — so it compiles to wasm alongside the rest of the module. It is
# the trust boundary for a Package's claims: the reducer parses the artifact here rather than
# trusting a caller that already parsed it.
lyracore-package-delta.workspace = true
# The Runtime Script Host's embedded Lua interpreter (src/runtime_script.rs). Pinned exactly, same house
# rule as the spacetimedb pin above: the fuel constants are sized against THIS version's metering,
# and the stdlib subset a Runtime Script sees is this version's — a minor bump can move both under
# scripts that already shipped.
piccolo = "=0.3.3"
# Only for the `Error` type the getrandom 0.3 custom backend must return. piccolo reaches getrandom
# through `ahash`, and `wasm32-unknown-unknown` has no built-in backend; the Module supplies one in
# `runtime_script::fixed_entropy`, selected by the `getrandom_backend` cfg in `.cargo/config.toml`.
getrandom = "0.3"

[dev-dependencies]
# Integration tests only. `spacetime call` parses every reducer argument as JSON, so a `String`
# parameter has to arrive as a JSON string literal rather than as bare text — this encodes them.
# Already in the lockfile through `lyracore-package-delta`, so it adds nothing to the tree.
serde_json = "1"

[lints]
workspace = true
