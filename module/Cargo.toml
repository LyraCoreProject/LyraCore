[package]
name = "lyracore-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "LyraCore SpacetimeDB module: all WoW 1.12 game state and logic."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
debug_reducers = []
package_test_fixture = ["debug_reducers"]
native_simulation_prototype = ["debug_reducers", "dep:serde", "dep:serde_json", "dep:spacetimedb-sats"]

[dependencies]
blake3 = "1"
# Pin the Module, SDK and CLI to the same SpacetimeDB version.
spacetimedb = { version = "=2.7.1", features = ["unstable"] }
lyracore-shared.workspace = true
lyracore-package-delta.workspace = true
# Fuel budgets and library behavior depend on this exact interpreter version.
piccolo = "=0.3.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
spacetimedb-sats = { version = "=2.7.1", features = ["serde"], optional = true }

[[example]]
name = "native_simulation_prototype"
required-features = ["native_simulation_prototype"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
lyracore-test-support.workspace = true
serde_json = "1"

[lints]
workspace = true
