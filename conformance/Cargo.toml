[package]
name = "lyracore-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The LyraCore Feature Ledger and its evidence requirements."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
lyracore-shared.workspace = true
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
wow_world_messages = { version = "0.3", default-features = false, features = ["vanilla", "sync"] }
wire-client.workspace = true
wow_world_base = { version = "=0.2.0", features = ["vanilla"] }

[lints]
workspace = true
