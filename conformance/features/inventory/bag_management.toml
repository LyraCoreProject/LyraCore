[[known_gaps]]
description = "Ordinary equipping and direct equipment purchases omit on-equip spells and the 30-second equip cooldown for on-use spells, including SMSG_ITEM_COOLDOWN."
path = "module/src/items/inventory.rs"
symbol = "apply_item_move"
evidence = "Pinned vmangos Player::EquipItem calls _ApplyItemMods (which calls ApplyItemEquipSpell) and ApplyEquipCooldown; see https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp. apply_item_move only binds the item, moves it and recomputes vitals and the sheet. review_equipment_purchase_shares_ordinary_equip_effects_or_records_the_gap observes no aura for an on-equip spell and no spell cooldown or cooldown packet for an on-use spell through either route."
