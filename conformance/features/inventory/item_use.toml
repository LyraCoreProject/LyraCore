[real_client]
status = "unverified"

[[known_gaps]]
description = "The Module returns an unavailable response for CMSG_WRAP_ITEM."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "No spell unlocks an item, so CMSG_OPEN_ITEM refuses every item whose lock needs a skill with ITEM_LOCKED."
path = "module/src/loot/item.rs"
symbol = "needs_lockpicking"
evidence = "vmangos HandleOpenItemOpcode opens a lockbox once ITEM_DYNFLAG_UNLOCKED is set; LyraCore item rows have no unlocked flag."

[[known_gaps]]
description = "A Transfer keeps an opened item's money but drops its remaining items; vmangos keeps item loot on the item guid."
path = "module/src/loot/item.rs"
symbol = "open_item"
evidence = "game_loot_money is a Character-owned Transfer table; game_corpse_loot rows are not."

[[deliberate_deviations]]
id = "spent_charge_mail_and_auction"
result = "Mail answers MAIL_ERR_INTERNAL_ERROR and the Auction House AUCTION_ERR_INVENTORY with ITEM_NOT_FOUND for an item that has spent a spell charge. The Reference Server moves the item and keeps its charges."
reason = "game_mail, game_auction and their cross-Shard parcels cannot carry spent charges yet, and an item that arrived with its template charges would refill them. The refusal stays until those rows carry the charges."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/MailHandler.cpp"

[[known_gaps]]
description = "The Operator Content API and Package Deltas cannot set spellcharges_1 to spellcharges_5, so an Operator-made or Package-made consumable has no charge limit and is never used up."
path = "module/src/operator_content/items.rs"
symbol = "item_fields"
evidence = "operator_content/items.rs keeps the spellcharges columns and a create sets them to zero; the Package Delta item schema in crates/lyracore-package-delta/src/schema.rs has no spellcharges column."

[[known_gaps]]
description = "An item use refused for no charges left answers \"can't do that right now\", not SPELL_FAILED_NO_CHARGES_REMAIN, and the client shows no charge count."
path = "module/src/items/ops.rs"
symbol = "apply_item_use_on"
evidence = "vmangos Spell::CheckItems sends SPELL_FAILED_NO_CHARGES_REMAIN; apply_item_use_on maps every cast Gate refusal without an item refusal to ItemRefusal::NotRightNow, and the item query and ITEM_FIELD_SPELL_CHARGES send zero charges."

[[known_gaps]]
description = "An item's required spell is not checked before use. vmangos Player::CanUseItem refuses an item whose RequiredSpell the Character does not know with EQUIP_ERR_NO_REQUIRED_PROFICIENCY."
path = "module/src/items/inventory.rs"
symbol = "check_user_requirements"
evidence = "The importer does not keep item_template.required_spell, so game_item_template has no required spell column."

[[known_gaps]]
description = "An item's required honor rank is not checked before use. vmangos Player::CanUseItem refuses an item, such as a PvP mount, whose RequiredHonorRank is above the Character's rank with EQUIP_ERR_CANT_EQUIP_RANK."
path = "module/src/items/ops.rs"
symbol = "apply_item_use_on"
evidence = "game_item_template has no required honor rank column, and the Module keeps no honor rank."
