[[known_gaps]]
description = "The Module returns an unavailable response for CMSG_WRAP_ITEM."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "No spell unlocks an item, so CMSG_OPEN_ITEM refuses every item whose lock needs a skill with ITEM_LOCKED."
path = "module/src/loot/item.rs"
symbol = "needs_lockpicking"
evidence = "vmangos HandleOpenItemOpcode opens a lockbox once ITEM_DYNFLAG_UNLOCKED is set; LyraCore item rows have no unlocked flag."

[[known_gaps]]
description = "A Transfer keeps an opened item's money but drops its remaining items; vmangos keeps item loot on the item guid."
path = "module/src/loot/item.rs"
symbol = "open_item"
evidence = "game_loot_money is a Character-owned Transfer table; game_corpse_loot rows are not."

[[deliberate_deviations]]
id = "spent_charge_mail_and_auction"
result = "Mail answers MAIL_ERR_INTERNAL_ERROR and the Auction House AUCTION_ERR_INVENTORY with ITEM_NOT_FOUND for an item that has spent a spell charge. The Reference Server moves the item and keeps its charges."
reason = "game_mail, game_auction and their cross-Shard parcels cannot carry spent charges yet, and an item that arrived with its template charges would refill them. The refusal stays until those rows carry the charges."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/MailHandler.cpp"

[[known_gaps]]
description = "The Operator Content API and Package Deltas cannot set spellcharges_1 to spellcharges_5, required_spell or required_honor_rank, so an Operator-made or Package-made consumable has no charge limit and is never used up, and no such item needs a spell or an honor rank."
path = "module/src/operator_content/items.rs"
symbol = "item_fields"
evidence = "operator_content/items.rs keeps the spellcharges, required_spell and required_honor_rank columns and a create sets them to zero; the Package Delta item schema in crates/lyracore-package-delta/src/schema.rs has none of them."
