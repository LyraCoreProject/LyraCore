description = "ModSkill now projects signed skill bonuses from all 206 equipment items into combat, existing skill requirements and PLAYER_SKILL_INFO. Eleven of those items modify Fishing (356). Their bonus fields are correct, but the existing fishing path selects loot without a skill-dependent success roll, so these bonuses cannot change fishing success yet. This change does not add that missing fishing mechanic."
