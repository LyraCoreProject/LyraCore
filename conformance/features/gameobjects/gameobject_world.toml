[real_client]
status = "unverified"

[[deliberate_deviations]]
id = "chest_without_respawn_time"
result = "A looted chest whose spawn and template have no positive respawn time, or that stands in an Instance, stays despawned until the Instance or the World Source reloads. The Reference Server keeps a world chest with a zero respawn delay in place and lets it be opened again at once, and respawns an Instance chest after its respawn delay."
reason = "A zero-delay chest that refills the moment it is looted hands out unlimited loot. Instance chests keep the rule they had before chests respawned: their loot comes back with the next Instance."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/GameObject.cpp"

[[deliberate_deviations]]
id = "pool_chances_short_of_a_whole_roll"
result = "A pool with a limit of 1 whose members all carry chances that add up to less than 100 percent always rolls one of them, in proportion to their chances. The Reference Server rolls none of them for the rest of the roll, and that place stays empty until the pool is loaded again. 29 nested pools in the pinned World Source sum to 80 or 95 percent."
reason = "An empty place that never refills is a data hole, not a 1.12 rule; the chances still set which member the place shows."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Maps/Pool/PoolManager.cpp"

[[deliberate_deviations]]
id = "nested_pool_without_another_free_place"
result = "When a looted or gathered object of a nested pool leaves and its parent pool has no other child pool free, the same child pool rolls a replacement after its respawn delay. A child pool with no placement never takes one of its parent's places. The Reference Server leaves that place empty until the pool is loaded again in both cases."
reason = "A place that never refills shrinks the pool for the life of the Realm; LyraCore keeps the pool's count instead."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Maps/Pool/PoolManager.cpp"

