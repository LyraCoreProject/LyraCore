schema_version = 1
id = "hunter_pet_lifecycle"
system = "pets"
scope = "A Hunter tames an eligible creature and commands, dismisses or abandons the pet with the corresponding ownership and persistence rules. Taming is refused while the Hunter has a pet, live or durable. Abandon removes the live Hunter pet and its durable identity for good, so the Hunter can tame again. Call Pet brings a dismissed pet back with its level, loyalty, happiness, name, model, spells and the health and power it left with, and refuses with a tame failure when the Hunter has no pet or the pet is dead. Revive Pet brings a dead pet back beside the Hunter with the effect's percent of its maximum health, and is refused with a tame failure when the Hunter has a pet out, has no pet or the pet is not dead. A pet that was out at logout is out again at world entry. Stables and action-bar editing are separate Behaviors."
requests = ["0x012E", "0x0175", "0x0176"]
replies = ["0x0173", "0x0179"]
dependencies = []
required_rungs = ["durable_module", "tier1", "conformance_audit", "real_client"]
scenarios = []
prerequisites = ["A tameable creature, its template and the Hunter's spells are present.", "Revive Pet (982) is imported by an importer that maps SPELL_EFFECT_SUMMON_DEAD_PET to E_REVIVE_PET; older imports hold it as E_SCRIPTED until the spell family is reimported."]

[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/Handlers/PetHandler.cpp"
symbol = "WorldSession::HandlePetAction"

[real_client]
status = "unverified"

[[deliberate_deviations]]
id = "tame_replaces_dead_pet_before_revive_import"
result = "While the Realm's spell data has no E_REVIVE_PET effect for Revive Pet (982), a tame replaces a dead durable pet instead of refusing with PETTAME_ANOTHERSUMMONACTIVE."
reason = "Before a spell reimport Revive Pet is a scripted no-op, so refusing would leave a Hunter whose pet died with no pet and no way to get one."
source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp"

[[known_gaps]]
description = "A dead pet cannot be abandoned: LyraCore removes the pet at death, while vmangos keeps its corpse, which CMSG_PET_ABANDON can delete until it decays."
path = "module/src/creatures/hunter_pet.rs"
symbol = "abandon_pet"
evidence = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/PetHandler.cpp WorldSession::HandlePetAbandon"

[[known_gaps]]
description = "Dismiss Pet (2641, SPELL_EFFECT_DISMISS_PET) imports as a scripted effect that does nothing; only the pet bar's dismiss command dismisses the pet."
path = "module/src/spell/cast/targeting.rs"
symbol = "apply_effect"
evidence = "importer/src/spell_kind.rs maps effect 102 to E_SCRIPTED; https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/SpellEffects.cpp Spell::EffectDismissPet"

[[known_gaps]]
description = "Call Pet with a pet already out resolves and adds nothing; vmangos refuses the cast with SPELL_FAILED_ALREADY_HAVE_SUMMON."
path = "module/src/spell/cast/resolve.rs"
symbol = "check_cast_gates"
evidence = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp Spell::CheckCast"

[[known_gaps]]
description = "A Revive Pet that the Gate refuses at cast completion, after its cast time, sends SMSG_CAST_RESULT without the SMSG_PET_TAME_FAILURE it sends when refused at the start."
path = "module/src/spell/scheduler.rs"
symbol = "fire_pending_cast"
evidence = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp Spell::CheckCast"

[[known_gaps]]
description = "A refused tame reports SPELL_FAILED_DONT_REPORT without the SMSG_PET_TAME_FAILURE reason vmangos sends first."
path = "module/src/creatures/hunter_pet.rs"
symbol = "validate_tame"
evidence = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp Spell::CheckTamingSpell"

