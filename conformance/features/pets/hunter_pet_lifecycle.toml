schema_version = 1
id = "hunter_pet_lifecycle"
system = "pets"
scope = "A Hunter tames an eligible creature and commands, dismisses or abandons the pet with the corresponding ownership and persistence rules. Taming is refused while the Hunter has a pet, live or durable. Call Pet brings a dismissed pet back with its level, loyalty, happiness, name and spells, and refuses with a tame failure when the Hunter has no pet or the pet is dead. A pet that was out at logout is out again at world entry. Stables and action-bar editing are separate Behaviors."
requests = ["0x012E", "0x0175", "0x0176"]
replies = ["0x0173", "0x0179"]
dependencies = []
required_rungs = ["durable_module", "tier1", "conformance_audit", "real_client"]
scenarios = []
deliberate_deviations = []
prerequisites = ["A tameable creature, its template and the Hunter's spells are present."]

