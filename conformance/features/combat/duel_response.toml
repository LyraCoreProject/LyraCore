schema_version = 1
id = "duel_response"
system = "combat"
scope = "Two Characters can accept or cancel a duel challenge."
requests = ["0x016C", "0x016D"]
replies = []
dependencies = []
required_rungs = ["tier1", "conformance_audit", "real_client"]
scenarios = []
deliberate_deviations = [
  { id = "unstarted_duel_removes_no_auras", result = "A Duel that ends before its countdown finishes removes no Aura. vmangos DuelComplete compares each Aura's apply time with a start time that is still 0, so it removes every negative Aura the opponent cast, including ones that predate the challenge.", reason = "Auras cast before the challenge are not part of the Duel, and no Aura can be cast on the opponent between the challenge and the start.", source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp#L6726-L6821" },
  { id = "instance_move_flees_the_duel", result = "A duelist who changes Instance on the same map flees the Duel and the opponent wins. vmangos flees only when the map id changes.", reason = "A Duel belongs to one map and Instance and cannot continue in another.", source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp#L1870-L1884" },
  { id = "pending_challenge_teleport_has_no_winner", result = "A Character that teleports to another map while its challenge is still pending interrupts it with no SMSG_DUEL_WINNER. vmangos completes it as DUEL_FLED and names the challenger the winner.", reason = "A challenge nobody accepted has no winner to announce.", source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp#L1870-L1884" },
]
