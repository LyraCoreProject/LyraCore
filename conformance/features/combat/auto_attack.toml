    { path = "module/tests/conformance/queued_strikes.rs", function = "a_dodged_queued_strike_sends_its_go_miss_then_a_dodge_swing", rung = "durable_module" },
    { path = "module/tests/conformance/queued_strikes.rs", function = "a_glancing_queued_strike_sends_go_then_a_glancing_swing_then_its_damage_log", rung = "durable_module" },
    { path = "module/tests/conformance/queued_strikes.rs", function = "a_fully_blocked_queued_strike_still_sends_its_swing_and_a_damage_log", rung = "durable_module" },
]

