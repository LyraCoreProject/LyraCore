[[known_gaps]]
description = "Roll rates are measured through Tier 1 delivered packets; TCP audits report white_melee_sample until full TCP collection exists. Rear attacks, offhand, other contexts and stock-client melee remain unverified."
path = "module/tests/conformance/rolls.rs"
symbol = "public_seeds"
evidence = "docs/adr/0007-statistical-roll-conformance.md"

[[known_gaps]]
description = "A queued strike's SMSG_ATTACKERSTATEUPDATE omits four vmangos hit-info flags: the guessed table flags ROLLED_DODGE 0x100 and ROLLED_PARRY 0x200, PvP 0x40000 and blood spurt 0x2000. White swings omit them too. A strike that adds a Seal of Righteousness portion reports no absorbed amount, because the seal shares the absorb. The queued strike classifier masks these flags, and its context absorbs nothing."
path = "crates/lyracore-protocol/src/codec/combat.rs"
symbol = "build_queued_strike_swing"
evidence = "Source reading at d9173eca: Spell.cpp Spell::SendMeleeAttackingStateUpdate, SpellCaster.cpp RollMeleeOutcomeAgainst sets the ROLLED_* flags, Unit.cpp SetDamageIndependentHitInfoFlags and SetDamageDependentHitInfoFlags. LyraCore: module/src/combat/swing.rs fire_melee_swing writes no absorbed amount on the queued strike's GO row when a seal portion is folded in."

[[known_gaps]]
description = "An avoided instant cast reaches its caster as an SMSG_SPELL_GO that lists the target as hit, plus SMSG_SPELLLOGMISS (#1186). vmangos sends the caster and observers one GO with the avoided target in the miss list and no SMSG_SPELLLOGMISS for a miss, dodge or parry. Tier 1 cannot classify an avoided Mortal Strike, so white_melee_outcomes holds weapon_strike_sample at both levels for both public seeds and the cast Weapon Strike's rates stay unmeasured. After #1186 the block category still fails: a cast Weapon Strike is never partially blocked (spells/spell_cast_kinds.toml, hit_roll), so its damage log reports blocked 0. Since #1177 the damage log carries a blocked amount, but only a queued strike's GO row writes one."
path = "module/src/native/cast.rs"
symbol = "receive"
evidence = "Source reading at d9173eca: Spell.cpp Spell::SendSpellGo and Spell::WriteSpellGoTargets; SMSG_SPELLLOGMISS reports immune and evade in Spell::DoSpellHitOnUnit and a resisted damage shield in Unit.cpp, never a miss, dodge or parry. LyraCore: native/cast.rs receive sends the instant-cast prelude GO with build_spell_go(target); native/spell.rs cast_event_messages sends the resolved GO to Peers and SMSG_SPELLLOGMISS to the source. ADR 0007 derives the cast Weapon Strike's rates; module/tests/conformance/weapon_strikes.rs collects them."

[[known_gaps]]
description = "Other white melee contexts retain the legacy Character dodge formula, Character parry and block eligibility, creature crushing chance, weapon-skill bonuses and offhand weapon-skill selection. Controlled units, ranged Weapon Strikes, ranged swings and target-side hit/crit auras need separate conformance."
path = "module/src/combat/attack_table.rs"
symbol = "attack_table_for"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/SpellCaster.cpp"

[[known_gaps]]
description = "Melee leeway applies when both units moved within the last 1.2 s. vmangos requires both units to move without walking at that instant (IsMovingButNotWalking), so a unit that just stopped or walks keeps the leeway here."
path = "module/src/combat/reach.rs"
symbol = "moved_within_leeway_window"
evidence = "Source reading, not measured. At d9173eca, Object.cpp WorldObject::GetLeewayBonusRangeForTargets checks IsMovingButNotWalking on both units for auto attacks: https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Object.cpp#L1890"
