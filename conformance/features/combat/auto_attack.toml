deliberate_deviations = [
  { id = "moving_character_reach_floor", result = "A moving Character that swings at a moving unit other than a Character reaches at least 9 yd. vmangos gives a normal pair 5 + 2.66 = 7.66 yd.", reason = "A creature's stored position moves to its rendered point once per 0.5 s movement tick, and swings run every 100 ms. A creature that flees at run speed is then up to 3.5 yd behind where the client draws it, so a Character at its rendered back needs 5 + 3.5 yd. A Character's position follows its own client movement, so two Characters keep 7.66 yd.", source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Object.cpp#L1890" },
]
