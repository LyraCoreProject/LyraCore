[[known_gaps]]
description = "A queued strike is not delivered as vmangos delivers it, in four ways (#1177). It sends no SMSG_ATTACKERSTATEUPDATE; vmangos sends one with the strike's spell id, table outcome and partial-block flag before its damage log. Its damage log always reports blocked 0. A fully blocked strike sends no damage log, and Heroic Strike rank 1 with Worn Axe is always fully blocked. A blocked glancing strike becomes a Block outcome, so the glancing is lost. Tier 1 cannot classify the strike until all four are fixed, so white_melee_outcomes holds queued_strike_sample at both levels for both public seeds and the queued strike's rates stay unmeasured."
path = "module/src/native/combat.rs"
symbol = "combat_event"
evidence = "Source reading at d9173eca: Spell.cpp Spell::SendMeleeAttackingStateUpdate and its two calls in Spell::DoAllEffectOnTarget; Unit.cpp CalculateAbsorbResistBlock. LyraCore: combat_event skips the packet when spell_swing is set; lyracore-protocol codec/combat.rs writes blocked 0; native/spell.rs damage_log skips a zero-damage row; combat/folds.rs turns a blocked Glancing into Block. ADR 0007 derives the queued strike's rates; module/tests/conformance/queued_strikes.rs collects them."

[[known_gaps]]
description = "A cast Weapon Strike is not delivered as vmangos delivers it. For an instant cast the native cast handler sends the caster an SMSG_SPELL_GO before the roll, and it always lists the target as hit. A miss, dodge or parry then reaches the caster as SMSG_SPELLLOGMISS, and only observers get a GO with the target in its miss list. vmangos sends one GO to the caster and observers, with the avoided target in the miss list (reason 1, 3 or 4), and sends no SMSG_SPELLLOGMISS for these outcomes. Tier 1 cannot classify an avoided Mortal Strike, so white_melee_outcomes holds weapon_strike_sample at both levels for both public seeds and the cast Weapon Strike's rates stay unmeasured. After that fix the block category still fails: a cast Weapon Strike is never partially blocked (spells/spell_cast_kinds.toml), and the damage log always reports blocked 0 (#1177)."
path = "module/src/native/cast.rs"
symbol = "receive"
evidence = "Source reading at d9173eca: Spell.cpp Spell::SendSpellGo and Spell::WriteSpellGoTargets; SendSpellMiss is called only for immune and evade in Spell::DoSpellHitOnUnit. LyraCore: native/cast.rs receive sends the instant-cast prelude GO with build_spell_go(target); native/spell.rs cast_event_messages sends the resolved GO to Peers and SMSG_SPELLLOGMISS to the source. ADR 0007 derives the cast Weapon Strike's rates; module/tests/conformance/weapon_strikes.rs collects them."

