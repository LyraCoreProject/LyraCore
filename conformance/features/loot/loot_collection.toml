[[known_gaps]]
description = "A Polymorph, Gouge, charm or possess does not close a Character's Loot Window. vmangos closes it from Unit::ModConfuseSpell, HandleAuraModStun and the possess and charm Aura handlers. The importer gives confuse, charm, possess, pacify and the Gouge stun one A_CONTROL class (M_POLY), and the Aura row cannot tell them apart. Spell.dbc header mechanics do not separate them either: 60 of these spells and 29 pacify-only spells have mechanic 0, and Blessing of Protection is a pacify. A stun and a fear close it."
path = "module/src/spell/tables.rs"
symbol = "stuns_or_fears"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Unit.cpp"
