[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/Handlers/ItemHandler.cpp"
symbol = "WorldSession::HandleListInventoryOpcode"

[real_client]
status = "unverified"

[[known_gaps]]
description = "Vendor offer conditions, required honor rank, honor discounts and required equip spells have no representation in the current vendor and item metadata."
path = "module/src/items/economy.rs"
symbol = "apply_buy_item_to"
evidence = "Pinned vmangos Player::BuyItemFromVendor checks stock, visibility conditions and honor rank; GetReputationPriceDiscount checks visual honor rank; CanUseItem checks RequiredSpell. The vendor and item tables omit condition, honor and required-spell metadata. vendor_transactions buys unlimited, unconditional offers and has no honor or required-spell case."

[[known_gaps]]
description = "Sale value still uses the template sell price without charge or durability adjustments; buyback retains the amount paid at sale time. Exact damaged-item and charged-item sale values need the corresponding item metadata and DBC cost catalogues."
path = "module/src/items/economy.rs"
symbol = "apply_item_sell_count"
evidence = "Pinned vmangos ItemHandler.cpp HandleSellItemOpcode adjusts for spell charges and DurabilityCosts/Quality. The Module still calls sell_value(template.sell_price, count); vendor_transactions has no damaged or charged sale."

[[known_gaps]]
description = "Fresh conformance Item projections omit later enchantment words, so they cannot check buyback's Random Property enchantment slots or Temporary Enchantment fields. Durable buyback tests check the retained state and Temporary Enchantment delivery."
path = "module/src/native/debug/projection.rs"
symbol = "item_projection"
evidence = "build_item_create_object reaches enchantment slot 0; item_projection adds Container links but omits build_enchantment_slot_values. Reference Item enchantments occupy fields 22 through 42. Fixing the fixture also needs the active-duration field representation to agree with delivered values; vendor_transactions has no enchanted sale and produces no signature for this gap."

[[known_gaps]]
description = "vendor_transactions buys unlimited offers and does not measure limited stock or restock."
path = "module/tests/conformance/buy_in_slot.rs"
symbol = "vendor_stock_both_buy_opcodes_share_stock_and_refuse_atomically"
evidence = "Durable tests check list counts, both buy opcodes, refusal atomicity, per-spawn counters and lazy restock against Creature::GetVendorItemCurrentCount and UpdateVendorItemCurrentCount at d9173eca3ea08dd985c52dabbcc826898d1d0b77. A scenario author must add a limited offer with BuyCount greater than one, two Characters sharing a spawn, a second spawn, stock exhaustion, refused purchases, and list reads before and after restock boundaries. No harness PR is assigned."

[[known_gaps]]
description = "Grid unloading resets vmangos creature stock; LyraCore has no grid-unload lifecycle."
path = "module/src/items/vendor_stock.rs"
symbol = "available"
evidence = "At d9173eca3ea08dd985c52dabbcc826898d1d0b77, Map::UnloadGrid destroys creature objects, whose destructor clears m_vendorItemCounts; GridUnload defaults to true in World.cpp. The maintainer agreed to keep this existing lifecycle difference as a follow-up. Ordinary respawn, spawn removal and server restart have durable coverage in this change."

[[deliberate_deviations]]
id = "stock_zero_delay"
result = "A computed flagged restock interval of zero is floored to one second."
reason = "The maintainer agreed to preserve restock without reproducing the Reference Server's division by zero."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Creature.cpp"
