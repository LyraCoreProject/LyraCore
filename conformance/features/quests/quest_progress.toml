[[deliberate_deviations]]
id = "failed_quest_retry"
result = "A Character can take a failed quest again from its giver without abandoning it first. The Reference Server keeps the quest at QUEST_STATUS_FAILED and refuses it until the Character abandons it."
reason = "LyraCore keeps a failed quest in its log slot and resets it in that slot when it is taken again, so the Character does not have to abandon it first. This existed before the quest availability rules and the maintainer kept it."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp"

