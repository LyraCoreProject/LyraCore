[[known_gaps]]
description = "A Character who gains or loses the money a quest costs keeps the old quest log slot state until the next object update. The Reference Server updates it in Player::MoneyChanged."
path = "module/src/quest.rs"
symbol = "quest_is_complete"
evidence = "quest_is_complete reads the held money on every call, so the giver mark, request window and turn-in follow it at once. Nothing pushes a quest log slot update when money changes; vmangos Player.cpp MoneyChanged calls CompleteQuest or IncompleteQuest."

