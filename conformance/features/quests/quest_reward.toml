description = "Quest reward text and title differ in tier 1 because the fixture authors its own quest text; the Reference Server text stays out of the repository. The offer-reward packet also omits the reward spell the Reference Server shows."
path = "module/src/native/quest.rs"
symbol = "offer_reward"
evidence = "quest_reward tier 1 with conformance.19 conforms on every rule; data signatures world_text_397_text and world_text_397_title remain at offer and repeat. Expected text hashes f3532f35... and 84bf6d36... come from the vmangos reference trace; the fixture text 'Fixture reward 2158.' hashes differently. game_quest_reward_spell keeps only the learned spell of RewSpellCast or RewSpell, so RewSpell is not available to the packet."
