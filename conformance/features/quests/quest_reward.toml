[[deliberate_deviations]]
id = "absent_choice_slot"
result = "A turn-in that picks a choice slot below 6 with no item is refused and re-offers the reward. The Reference Server completes the quest and grants no choice item."
reason = "A real 1.12 client cannot send an empty slot, because vmangos and the LyraCore importer close gaps in the choice list, so only a crafted packet reaches this case, and refusing it is safer. The maintainer agreed to keep the refusal."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp"

[[known_gaps]]
description = "Quest reward text and title differ in tier 1 because the fixture authors its own quest text; the Reference Server text stays out of the repository. The offer-reward packet also omits the reward spell the Reference Server shows."
path = "module/src/native/quest.rs"
symbol = "offer_reward"
evidence = "quest_reward tier 1 with conformance.19 conforms on every rule; data signatures world_text_397_text and world_text_397_title remain at offer and repeat. Expected text hashes f3532f35... and 84bf6d36... come from the vmangos reference trace; the fixture text 'Fixture reward 2158.' hashes differently. game_quest_reward_spell keeps only the learned spell of RewSpellCast or RewSpell, so RewSpell is not available to the packet."

[[known_gaps]]
description = "A dead Character cannot turn in a quest. The Reference Server lets a ghost talk to a quest giver that is visible to the dead, as for quest 3912."
path = "module/src/native/quest.rs"
symbol = "evaluations"
evidence = "evaluations returns nothing for a dead Character, and request_turn_in_quest refuses a dead player. This predates the Behavior work; vmangos HandleQuestgiverChooseRewardOpcode checks IsVisibleForDead on the giver instead."

[[known_gaps]]
description = "When each reward fits the bags alone but not together, the turn-in refusal shows the quest-failed inventory notice. The Reference Server shows the inventory-full equip error there."
path = "module/src/native/quest.rs"
symbol = "refused_turn_in_screen"
evidence = "Player::CanRewardQuest sends SMSG_QUESTGIVER_QUEST_FAILED when one reward does not fit alone and SMSG_INVENTORY_CHANGE_FAILURE when the free slot count is below the reward count. exchange_items reports both as one inventory-full refusal. It also takes the quest items before storing the rewards, so a hand-in that frees a slot completes where vmangos runs CanStoreNewItem first and refuses with reason 4 (Player.cpp:12752-12788). vmangos also counts empty slots against one slot for the choice plus one per stack for each fixed item (Player.cpp:12746, 12786, 12790-12794), so it refuses with 0x0112 where rewards would stack into partial stacks; LyraCore grants them."
