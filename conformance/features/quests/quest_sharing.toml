[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/Handlers/QuestHandler.cpp"
symbol = "WorldSession::HandlePushQuestToParty"

[real_client]
status = "unverified"

[[deliberate_deviations]]
id = "accept_needs_quest_share"
result = "An accept that names a party member as the giver needs that member's Quest Share of the quest. The Reference Server accepts a shareable quest from any online, alive player anywhere in the world who is on it, with or without a share, and checks no Group."
reason = "The stock client names a player giver only for quest details a share sent, so the share is required to stop a crafted accept taking quests from another Character's log."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/QuestHandler.cpp"

[[deliberate_deviations]]
id = "unshareable_push_refused"
result = "A push of a quest without QUEST_FLAGS_SHARABLE is refused and nobody hears anything. The Reference Server tells the sharer SHARING_QUEST for every member and shows each eligible member the quest details; the later accept then fails CanShareQuest."
reason = "The stock client disables the share button for such a quest, and refusing the push keeps a Quest Share that no accept can use out of the receiver's way."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/QuestHandler.cpp"

[[known_gaps]]
description = "The Module returns an unavailable response for CMSG_QUEST_CONFIRM_ACCEPT, and accepting a QUEST_FLAGS_PARTY_ACCEPT quest offers it to no party member."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "The Reference Server compares positions without the map at a push, so a member on another map at nearby coordinates is offered the quest; LyraCore answers TOO_FAR for every member on another map. A member whose failed quest is still in the log hears HAVE_QUEST from the Reference Server; LyraCore offers it, since a failed quest can be taken again. The Reference Server refuses the accept of a shared quest from a dead sharer; LyraCore accepts."
path = "module/src/quest/share.rs"
symbol = "evaluate_share"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Object.cpp WorldObject::IsWithinDist; src/game/Handlers/QuestHandler.cpp WorldSession::HandlePushQuestToParty and HandleQuestgiverAcceptQuestOpcode; src/game/Objects/Player.cpp Player::SatisfyQuestStatus and Player::CanInteractWithQuestGiver"
