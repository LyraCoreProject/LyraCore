[[deliberate_deviations]]
id = "accept_needs_quest_share"
result = "An accept that names a party member as the giver needs that member's Quest Share of the quest. The Reference Server accepts a shareable quest from any online, alive player anywhere in the world who is on it, with or without a share, and checks no Group."
reason = "The stock client names a player giver only for quest details a share sent, so the share is required to stop a crafted accept taking quests from another Character's log."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/QuestHandler.cpp"

[[deliberate_deviations]]
id = "unshareable_push_refused"
result = "A push of a quest without QUEST_FLAGS_SHARABLE is refused and nobody hears anything. The Reference Server tells the sharer SHARING_QUEST for every member and shows each member the quest details; the later accept then fails CanShareQuest."
reason = "The stock client disables the share button for such a quest, and refusing the push keeps a Quest Share that no accept can use out of the receiver's way."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/QuestHandler.cpp"

[[known_gaps]]
description = "The Module returns an unavailable response for CMSG_QUEST_CONFIRM_ACCEPT, and accepting a QUEST_FLAGS_PARTY_ACCEPT quest offers it to no party member."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "A push reaches members within the group XP range of 74 yards; the Reference Server's QUEST_SHARE_DISTANCE is 14 yards. Push results follow LyraCore's own check order for a member on, finished with or unable to take the quest. A member on another World Shard hears nothing; the Reference Server answers TOO_FAR for an online member on another map."
path = "module/src/quest/share.rs"
