evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Object.h; src/game/Handlers/QuestHandler.cpp WorldSession::HandlePushQuestToParty"
