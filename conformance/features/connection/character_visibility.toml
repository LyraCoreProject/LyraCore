[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/Handlers/CharacterHandler.cpp"
symbol = "WorldSession::HandlePlayerLoginOpcode"

[real_client]
status = "unverified"

[[known_gaps]]
description = "Character CREATE omits the model bounding radius and combat reach. vmangos takes both from creature_display_info_addon by display id; the importer keeps bounding radius only per creature template and combat reach in game_display_combat_reach, which only the Module's Melee Reach reads."
path = "importer/src/world_import_creatures.rs"
symbol = "creature_display_info_addon"
evidence = "Tier 1 two_character_visibility and __opposite_faction at harness 004d8d74: field_129 is 0.306 for human male display 49 and 0.372 for orc male display 51 in the reference, field_130 is 1.5 for both; both fields are absent in core for both recipients. At d9173eca, Unit.cpp Unit::UpdateModelData sets UNIT_FIELD_BOUNDINGRADIUS and UNIT_FIELD_COMBATREACH from the display's addon row."

[[known_gaps]]
description = "Creature CREATE never sends UNIT_FIELD_COMBATREACH or UNIT_FIELD_BOUNDINGRADIUS, so the client never learns a creature's combat reach or model radius. vmangos sets both from the display's creature_display_info_addon row, scaled by the creature's scale."
path = "crates/lyracore-protocol/src/codec/entity.rs"
symbol = "build_create_object"
evidence = "Source reading, not measured. The creature branch of build_create_object sets neither field. At d9173eca, Unit.cpp Unit::UpdateModelData sets UNIT_FIELD_BOUNDINGRADIUS and UNIT_FIELD_COMBATREACH: https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Unit.cpp#L9364"

[[known_gaps]]
description = "Fixture gap: the visibility fixture installs no race rows, so the orc Character falls back to the human display 49 and faction template 1. Add ChrRaces rows for races 1 and 2 to the visibility fixture in a separate change."
path = "module/tests/conformance/tier1.rs"
symbol = "seed_visibility_world"
evidence = "Tier 1 two_character_visibility__opposite_faction at harness 004d8d74: the watcher sees the orc with fields_131 and _132 51 and field_35 2 in the reference, and 49 and 1 in core. world/character_entity.rs build_player_entity reads game_race_info, which only the DBC importer fills."

[[known_gaps]]
description = "An enemy Character entering a hostile capital receives no Honorless Target Aura."
path = "module/src/pvp.rs"
symbol = "enter_world"
evidence = "Tier 1 two_character_visibility__opposite_faction at harness 004d8d74: the watcher sees the orc with Honorless Target 2479 in field_48, flags 0x99 in field_95 and levels 0x0101 in field_101 in the reference, where core has 0x09 and 0x01 from Battle Stance alone. At d9173eca, the Honorless Target Aura comes from DELAYED_CAST_HONORLESS_TARGET, scheduled by a teleport."

[[known_gaps]]
description = "UNIT_FIELD_POWER4 differs because vmangos regenerates energy for every Character, so the reference value depends on time since the Character was saved. The data rule records it; no fixed value exists to match."
path = "crates/lyracore-protocol/src/codec/entity.rs"
symbol = "build_create_object"
evidence = "Tier 1 two_character_visibility at harness 004d8d74: field_26 is 60 in the reference and 100 in core; the opposite-faction variant records 80. At d9173eca, Player.cpp Player::RegenerateAll regenerates POWER_ENERGY for all classes."

[[known_gaps]]
description = "No VALUES update follows a weapon swap or a haste change, so a viewer keeps the attack time fields from CREATE. The off-hand field had this gap before."
path = "module/src/native/view.rs"
symbol = "entity"
evidence = "Review of PR 1040: view.rs sends UNIT_FIELD_BASEATTACKTIME and the off-hand attack time only in CREATE. At d9173eca, Unit.h Unit::SetAttackTime and Unit.cpp Unit::ApplyAttackTimePercentMod write the fields, so each change reaches viewers."

[[known_gaps]]
description = "Only a unit's raid sees its real health. An Empathy (Beast Lore) caster and a charmer still see a percent, because the Module models neither the Empathy Aura nor a charmer."
path = "module/src/native/health.rs"
symbol = "visible_health"
evidence = "Review of PR 1040. At d9173eca, Player.cpp Player::CanSeeHealthOf takes the owner from GetCharmerOrOwnerPlayerOrPlayerItself, and Player::CanSeeSpecialInfoOf shows raw health to the caster of a SPELL_AURA_EMPATHY Aura on the target."

[[known_gaps]]
description = "A pet's owner never receives the pet's attack power multiplier (an owner-only field): neither CREATE nor VALUES writes it. vmangos writes AP_MOD_PCT - 1 to the update field."
path = "module/src/native/view.rs"
symbol = "entity"
evidence = "Source reading, not measured. At d9173eca, StatSystem.cpp Creature::UpdateAttackPowerAndDamage writes AP_MOD_PCT - 1 at line 866 and Pet::UpdateAttackPowerAndDamage at line 1046."

[[known_gaps]]
description = "Flat attack power Auras, such as Demoralizing Shout, and Strength or Agility changes do not move a creature's or a pet's damage, because the Module does not store the database attack power. vmangos scales weapon damage by 0.3 * the attack power change / database attack power."
path = "module/src/combat/folds.rs"
symbol = "base_melee_range"
evidence = "Review of PR 1106, source reading, not measured. At d9173eca, StatSystem.cpp Creature::UpdateAttackPowerAndDamage and UpdateDamagePhysical at lines 842-858 and 925-929."

[[known_gaps]]
description = "A creature's ranged strike takes its damage from the melee range, so the ranged attack power percent Aura has nothing to scale and the melee one scales it instead. vmangos scales the creature's ranged damage by the ranged Aura only."
path = "module/src/combat/folds.rs"
symbol = "strike_weapon_range"
evidence = "Source reading, not measured. At d9173eca, StatSystem.cpp Creature::UpdateDamagePhysical scales RANGED_ATTACK damage by GetTotalAttackPowerValue at lines 925-929; Pet::UpdateAttackPowerAndDamage returns early for ranged at line 1027."

[[known_gaps]]
description = "A Form's own pool does not survive relog: a druid who logs out in a Form that shows rage or energy comes back with that pool empty. vmangos saves and restores every pool, so Bear rage and Cat energy return. The Reserve Pool (the druid's mana) does survive."
path = "module/src/character.rs"
symbol = "persist_entity"
evidence = "Source reading, not measured. At d9173eca, Player.cpp Player::SaveToDB writes power1 to power5 and Player::LoadFromDB restores each with SetPower after the Auras load; game_character keeps one power column, which holds the own pool."

[[known_gaps]]
description = "A creature's CREATE writes no power fields, and its current power never reaches a viewer; only a later change to its max power is sent, in VALUES. vmangos marks every UNIT_FIELD_POWERn and MAXPOWERn public, so a viewer sees a creature's mana and max mana from CREATE, then sees its mana fall and regenerate."
path = "module/src/native/visibility.rs"
symbol = "power_values"
evidence = "Source reading, not measured. At d9173eca, UpdateFields_1_12_1.cpp gives UNIT_FIELD_POWER1 to POWER5 UF_FLAG_PUBLIC, and Creature.cpp Creature::RegenerateMana adds to the creature's mana with ModifyPower."

[[known_gaps]]
description = "A reserved rage or energy pool neither decays nor regenerates; only reserved mana regenerates. No 1.12 Form reserves rage or energy, so this shows only with a Package Form on a warrior or rogue."
path = "module/src/combat/regeneration.rs"
symbol = "regenerate_characters"
evidence = "Source reading, not measured. At d9173eca, Player.cpp Player::RegenerateAll regenerates rage, energy and mana whatever the shown power type."
