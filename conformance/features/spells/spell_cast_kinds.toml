[[deliberate_deviations]]
id = "resist_and_block_at_launch"
result = "A travelling Spell rolls its partial resist and, for a melee or ranged damage-class Spell such as Arcane Shot, its partial block when it launches, and stores them for the impact. A target that turns away, gains a block or gains a resistance while the spell travels keeps the launch result. The Reference Server rolls only the damage and its crit at launch, in Spell::HandleDelayedSpellLaunch, and the block and resist at impact in Unit::CalculateAbsorbResistBlock, called from Spell::DoAllEffectOnTarget (Spell.cpp:1415)."
reason = "Rolling at launch keeps the draws of a travelling Spell in the Caster roll stream in cast order, so Roll Conformance stays stable whatever lands between launch and impact."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp"

[vmangos]
commit = "464179081673cfd240f7ffe7f0daf96bca0b5a70"
path = "src/game/Spells/Spell.cpp"
symbol = "Spell::cast"

[real_client]
status = "unverified"

