[[known_gaps]]
description = "Opening spell 21082 from the Base Snapshot is refused because its core synthetic fourth effect is outside Package API slots 0 through 2."
path = "importer/src/spell.rs"
symbol = "push_spell_effect_rows"
evidence = "conformance/vmangos-port-census/spell.md: spell 21082 snapshot and Package API bound."

[[known_gaps]]
description = "Sweeping Strikes never spends its five charges: the Module strikes no second target, and vmangos spends a charge only for each strike."
path = "module/src/spell/proc.rs"
symbol = "dummy_proc"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::HandleDummyAuraProc case 12292 casts 12723 at a random unit near the victim and returns SPELL_AURA_PROC_FAILED, keeping the charge, when it finds none; dummy_proc returns Failed for 12292 and 18765."

[[known_gaps]]
description = "A charged spell modifier, such as Clearcasting, Presence of Mind, Nature's Swiftness, Inner Focus or Elemental Mastery, shows its charges but the spell it modifies never spends them."
path = "module/src/spell/power.rs"
symbol = "spell_mod"
evidence = "Source reading, not measured. At d9173eca, Unit::ProcDamageAndSpellFor skips a holder whose SpellModifier carries charges, and Player::ApplySpellMod spends them when the modified spell is cast; spell_mod sums A_SPELLMOD_FLAT and A_SPELLMOD_PCT rows and never changes them."

[[known_gaps]]
description = "An extra attack spends a Flurry charge. vmangos keeps Flurry's charges while the attacker holds extra attacks, for example from Windfury."
path = "module/src/spell/proc.rs"
symbol = "proc_holders"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::IsTriggeredAtSpellProcEvent returns SPELL_PROC_TRIGGER_FAILED for SpellIconID 108 with SpellVisual 2759 while m_extraAttacks is set."

[[known_gaps]]
description = "A mechanic immunity refuses only an A_CONTROL effect. A movement slow, a disarm or any other aura effect of the immune mechanic still lands, and a damage effect of a spell whose header mechanic is immune still deals its damage."
path = "module/src/spell/cast/targeting.rs"
symbol = "apply_aura_effect"
evidence = "Source reading, not measured. At d9173eca, Unit.cpp Unit::IsImmuneToSpell refuses the whole spell for its header Mechanic, and Unit::IsImmuneToSpellEffect refuses any effect for its EffectMechanic; apply_aura_effect asks is_immune_to_mechanic only for A_CONTROL."

[[known_gaps]]
description = "Retaliation strikes back, and spends a charge, on a hit from behind and while its warrior is stunned. vmangos neither strikes nor spends then."
path = "module/src/combat/folds.rs"
symbol = "retaliate_on_hit"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::HandleDummyAuraProc case 20230 returns SPELL_AURA_PROC_FAILED unless HasInArc(pVictim) and the warrior can react; retaliate_on_hit checks neither."

[[known_gaps]]
description = "An instant weapon ability, such as Mortal Strike, is never blocked, so it never raises PROC_EX_BLOCK and never spends a Shield Block or Redoubt charge. A queued strike, such as Heroic Strike, can be blocked."
path = "module/src/spell/cast/resolve.rs"
symbol = "hit_roll"
evidence = "Source reading, not measured. At d9173eca, Unit.cpp Unit::ProcDamageAndSpell raises PROC_EX_BLOCK for SPELL_MISS_BLOCK and for a spell hit whose damageInfo->blocked is set; run_spell_effects deals a weapon ability's damage with no block amount, and hit_roll raises no block."

[[known_gaps]]
description = "An Auto Shot that misses or is dodged runs no proc pass, so a ranged Aura with PROC_EX_TRIGGER_ALWAYS or a named avoidance result does not count it."
path = "module/src/combat/swing.rs"
symbol = "fire_ranged_shot"
evidence = "Source reading, not measured. At d9173eca, Unit::ProcDamageAndSpell runs for an avoided ranged attack with PROC_EX_MISS or PROC_EX_DODGE; fire_ranged_shot schedules an impact only for damage, and ranged_impact returns before the pass when the shot's damage is zero."

[[known_gaps]]
description = "A school-mask power cost Aura (SPELL_AURA_MOD_POWER_COST_SCHOOL_PCT and SPELL_AURA_MOD_POWER_COST_SCHOOL, aura types 72 and 73) is not imported, so Insight lowers no spell cost, and its charge rule keys on spell 18820 instead of the aura type."
path = "importer/src/spell_kind.rs"
symbol = "aura_mod_to_kind"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp applies aura types 72 and 73 with Aura::HandleModPowerCostPCT and Aura::HandleModPowerCost, and UnitAuraProcHandler.cpp counts their charges with HandleModPowerCostSchoolAuraProc; aura_mod_to_kind maps both to A_INERT, and effect_proc names INSIGHT (18820)."

