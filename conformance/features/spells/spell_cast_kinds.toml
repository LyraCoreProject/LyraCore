evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp:5977 and 6012 Aura::PeriodicTick sends SendSpellNonMeleeDamageLog and calls DealHeal for SPELL_AURA_PERIODIC_LEECH; aura_mod_to_kind imports PeriodicLeech as A_PERIODIC_DAMAGE."

[[known_gaps]]
description = "A Triggered Cast refused for missing reagents sends its caster no cast-failed message. vmangos sends SPELL_FAILED_ITEM_NOT_READY."
path = "module/src/spell/cast/resolve.rs"
