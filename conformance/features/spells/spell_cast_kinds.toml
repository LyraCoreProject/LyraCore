[[known_gaps]]
description = "A travelling spell lands on a unit that stealthed or turned invisible in flight. vmangos lets a delayed spell evade its explicit target when the caster can no longer see it."
path = "module/src/spell/cast/impact.rs"
symbol = "land_spell_impact"
evidence = "Source reading, not measured. At d9173eca, Spell::DoSpellHitOnUnit (Spell.cpp:1636-1645) sends SPELL_MISS_EVADE when m_delayed and the explicit target is not IsVisibleForOrDetect; land_spell_impact has no visibility check."

[[known_gaps]]
description = "A travelling spell adds its table threat, flags its caster for PvP and runs its weapon-roll reacts at launch. vmangos adds the threat when the spell first reaches a unit, flags for PvP when it hits, and runs the reacts and procs of an avoided hit at impact."
path = "module/src/spell/cast/resolve.rs"
symbol = "run_spell_effects"
evidence = "Source reading, not measured. At d9173eca, Spell::handle_delayed calls _handle_immediate_phase, which calls HandleThreatSpells, on its first run; DoSpellHitOnUnit flags the caster through SetInCombatWithVictim and UpdatePvP; DoAllEffectOnTarget raises the avoided hit's procs. run_spell_effects calls add_table_threat, pvp::spell_targeted and CastTargets::answer in the cast."

