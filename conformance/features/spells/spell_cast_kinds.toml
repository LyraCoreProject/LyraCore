symbol = "cast_follow_up"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp runs a spell script's OnAfterHit from DoAllEffectOnTarget, at impact for a spell with speed; run_spell_effects calls cast_follow_up for every hit target before a scheduled impact lands."

[[known_gaps]]
description = "The immune proc pass simplifies vmangos Spell::m_canTrigger: it skips only a cast an Aura started, and runs for a harmful item spell. Missing are the SPELL_ATTR_EX3_NOT_A_PROC and family exceptions (Arcane Missiles, Blizzard, Rain of Fire, Hellfire, the trap effects, Seal of Command), the SUPPRESS_CASTER_PROCS and SUPPRESS_TARGET_PROCS pair, and the rule that a helpful item spell cannot trigger."
path = "module/src/spell/cast/resolve.rs"
symbol = "CastOrigin"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp Spell::prepareDataForTriggerSystem sets m_canTrigger from those rules; no shipped spell is known to reach them through an immune refusal."

[[known_gaps]]
description = "A refused helpful spell raises no proc event: the immune proc pass runs only for a harmful spell, because the Module has no proc bits for a helpful spell."
path = "module/src/spell/proc.rs"
symbol = "run_immune_proc_pass"
evidence = "Source reading, not measured. At d9173eca, Unit::ProcDamageAndSpell runs for any refused spell with the proc flags its polarity gives."

[[known_gaps]]
description = "A fear that lands deals no damage, so it runs no proc pass and does not use up Fear Ward. In vmangos a landed fear still procs the ward, which needs a landed fear to get past the immunity first, as with a SPELL_ATTR_NO_IMMUNITIES fear."
path = "module/src/spell/cast/resolve.rs"
