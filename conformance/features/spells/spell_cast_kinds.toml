[[known_gaps]]
description = "Sweeping Strikes never spends its five charges: the Module strikes no second target, and vmangos spends a charge only for each strike."
path = "module/src/spell/proc.rs"
symbol = "dummy_proc"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::HandleDummyAuraProc case 12292 casts 12723 at a random unit near the victim and returns SPELL_AURA_PROC_FAILED, keeping the charge, when it finds none; dummy_proc returns Failed for 12292 and 18765."

[[known_gaps]]
description = "A charged spell modifier, such as Clearcasting, Presence of Mind, Nature's Swiftness, Inner Focus or Elemental Mastery, shows its charges but the spell it modifies never spends them."
path = "module/src/spell/power.rs"
symbol = "spell_mod"
evidence = "Source reading, not measured. At d9173eca, Unit::ProcDamageAndSpellFor skips a holder whose SpellModifier carries charges, and Player::ApplySpellMod spends them when the modified spell is cast; spell_mod sums A_SPELLMOD_FLAT and A_SPELLMOD_PCT rows and never changes them."

[[known_gaps]]
description = "An extra attack spends a Flurry charge. vmangos keeps Flurry's charges while the attacker holds extra attacks, for example from Windfury."
path = "module/src/spell/proc.rs"
symbol = "proc_holders"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::IsTriggeredAtSpellProcEvent returns SPELL_PROC_TRIGGER_FAILED for SpellIconID 108 with SpellVisual 2759 while m_extraAttacks is set."

[[known_gaps]]
description = "An effect-type immunity (aura 37) or an aura-state immunity (aura 38) refuses no effect. The importer keeps both as A_IMMUNITY rows with p0_kind P_RAW, and no immunity check reads them. 27 spells carry one."
path = "module/src/spell/control.rs"
symbol = "is_immune_to_effect"
evidence = "Source reading, not measured. At d9173eca, Unit.cpp Unit::IsImmuneToSpellEffect also refuses an effect whose Effect is in m_spellImmune[IMMUNITY_EFFECT] or whose EffectApplyAuraName is in m_spellImmune[IMMUNITY_STATE]; is_immune_to_effect reads only mechanics. The count is the newest spell_template row through build 5875 in the vmangos 4641790 snapshot."

[[known_gaps]]
description = "Applying a mechanic immunity Aura does not remove the Auras it makes the unit immune to, so Will of the Forsaken cast while feared leaves the fear on."
path = "module/src/spell/cast/targeting.rs"
symbol = "aura_apply"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp Aura::HandleModMechanicImmunity and HandleModMechanicImmunityMask call Unit::RemoveAurasAtMechanicImmunity on apply for a spell with SPELL_ATTR_EX_IMMUNITY_PURGES_EFFECT."

[[known_gaps]]
description = "The PvP trinkets are unverified as immunity Auras: Insignia of the Alliance and Horde and Escape Artist may be Dispel Mechanic effects in vmangos, which this change does not touch."
path = "module/src/spell/control.rs"
symbol = "is_immune_to_mechanic"
evidence = "Not measured and not read. Berserker Rage 18499 and Will of the Forsaken 7744 are aura 77 and covered by tests; no trinket spell was checked against the vmangos spell dump."

[[known_gaps]]
description = "School immunity is decided when a spell or ranged shot launches. A unit that becomes immune while the spell or shot travels still takes it; vmangos checks a spell with travel time again on impact and reports immune."
path = "module/src/spell/scheduler.rs"
symbol = "fire_spell_impact"
evidence = "Source reading, not measured. At d9173eca, Spell::DoSpellHitOnUnit rechecks IsImmuneToDamage and IsImmuneToSpell for a spell with speed and sends SPELL_MISS_IMMUNE; fire_spell_impact and ranged_impact land the damage frozen at launch."

[[known_gaps]]
description = "The partial block of a travelling melee or ranged damage-class Spell, such as Arcane Shot, is rolled when it launches. A target that turns away or gains a block while the spell travels keeps the launch result; vmangos rolls the block on impact."
path = "module/src/spell/cast/targeting.rs"
symbol = "apply_damage_effect"
evidence = "Source reading, not measured. At d9173eca, Spell::DoSpellHitOnUnit calls Unit::CalculateAbsorbResistBlock, which calls IsSpellPartiallyBlocked, when a delayed spell hits (Spell.cpp:1415); apply_damage_effect rolls the block through mitigate_spell at launch and stores it in PendingSpellImpact.blocked."

[[known_gaps]]
description = "A Spell with SPELL_ATTR_EX3_COMPLETELY_BLOCKED, such as Hamstring, Wing Clip, Shield Bash or Kick, rolls the Attack Table but is never fully blocked. vmangos opens the block band for such a Spell, and a block refuses all its effects; 35 imported Spells carry the attribute."
path = "module/src/combat/attack_table.rs"
symbol = "attack_table"
evidence = "Source reading, not measured. At d9173eca, SpellCaster::RollMeleeOutcomeAgainst (SpellCaster.cpp:546-547) sets canBlock only for a Spell with SPELL_ATTR_EX3_COMPLETELY_BLOCKED and returns MELEE_HIT_BLOCK at line 676; attack_table closes the block band for every Spell."

[[known_gaps]]
description = "A Spell with SPELL_ATTR_EX_DISCOUNT_POWER_ON_MISS keeps its whole cost when it is avoided. vmangos gives back 82% of an energy cost on a miss, dodge, parry or immune result, and 82% of a rage cost on a dodge or parry."
path = "module/src/spell/cast/resolve.rs"
symbol = "run_spell_effects"
evidence = "Source reading, not measured. At d9173eca, Spell::DoAllEffectOnTarget (Spell.cpp:1266-1286) calls ModifyPower with lroundf(m_powerCost * 0.82f); the Module has no refund."

[[known_gaps]]
description = "A melee or ranged damage-class Spell is never resisted by the target's mechanic resistance. vmangos rolls MELEE_HIT_RESIST right after the miss band from SPELL_AURA_MOD_MECHANIC_RESISTANCE for the Spell's mechanic."
path = "module/src/combat/attack_table.rs"
symbol = "attack_table"
evidence = "Source reading, not measured. At d9173eca, SpellCaster::RollMeleeOutcomeAgainst (SpellCaster.cpp:483-497) adds the mechanic resistance band after the miss chance."

[[known_gaps]]
description = "A direct-damage Spell of damage class 0 with a magic school, such as an item's fire proc, can crit with the caster's spell crit chance. vmangos gives damage class 0 no crit chance."
path = "module/src/spell/cast/targeting.rs"
symbol = "direct_spell_crit_chance"
evidence = "Source reading, not measured. At d9173eca, Unit::GetSpellCritChance (Unit.cpp:5242-5243) returns 0 for SPELL_DAMAGE_CLASS_NONE."

[[known_gaps]]
description = "Retaliation strikes back at an attacker immune to physical damage and deals its damage. vmangos casts the Retaliation strike as a spell, so the attacker's immunity refuses it and the strike reports immune."
path = "module/src/combat/folds.rs"
symbol = "retaliate_on_hit"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp casts spell 22858 for the Retaliation proc, and Spell::SpellHitResult which returns SPELL_MISS_IMMUNE; retaliate_on_hit calls weapon_strike_damage and deal_damage without an immunity test."

[[known_gaps]]
description = "The holy portion that Seal of Righteousness adds to a landed white swing ignores a target immune to holy damage. vmangos deals that portion as a separate holy spell, which a holy immunity refuses."
path = "module/src/combat/folds.rs"
symbol = "seal_holy_on_swing"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp casts spell 25742 for the Seal of Righteousness melee proc, and its hit goes through Spell::SpellHitResult; seal_holy_on_swing adds the portion to the swing damage without an immunity test."

[[known_gaps]]
description = "A helpful spell with SPELL_ATTR_EX_IMMUNITY_PURGES_EFFECT is still refused by a school immunity of the other polarity, and a refused harmful spell with SPELL_ATTR_EX_NO_THREAT still draws the creature into combat. Both attributes are in AttributesEx, which the game_spell row does not keep."
path = "module/src/spell/school_immunity.rs"
symbol = "school_refuses_spell"
evidence = "Source reading, not measured. At d9173eca, Unit::IsImmuneToSpell and Unit::IsImmuneToSchool skip school immunity for SPELL_ATTR_EX_IMMUNITY_PURGES_EFFECT (0x8000), and Spell::DoAllEffectOnTarget skips the engagement for SPELL_ATTR_EX_NO_THREAT; game_spell keeps attributes, attributes_ex_2, attributes_ex_3 and attributes_ex_4 only."

[[known_gaps]]
description = "A queued strike refused as immune, like one that misses or is dodged or parried, sends no SMSG_ATTACKERSTATEUPDATE. vmangos sends the next-swing spell's attack state with the victim state of its miss."
path = "module/src/native/combat.rs"
symbol = "combat_event"
evidence = "Source reading, not measured. At d9173eca, Spell::DoAllEffectOnTarget calls SendMeleeAttackingStateUpdate for a next-melee-swing spell that deals no damage, with SpellMissInfoToVictimState of its miss; combat_event skips the attack state for a spell swing."

[[known_gaps]]
description = "A creature's white swing and its victim selection treat its melee as physical: the importer reads no creature_template damage_school."
