evidence = "Source reading, not measured. At d9173eca, Spell.cpp:7069-7076 Spell::IgnoreItemRequirements returns false for a triggered spell whose item target is not the caster's; every Triggered Cast request carries no item_target, and no shipped spell is known to reach it."

[[known_gaps]]
description = "A periodic trigger that is not channeled casts from the Aura's applier, so its reagents come from the applier's bags. vmangos casts it from the wearer."
path = "module/src/spell/scheduler.rs"
symbol = "tick_auras"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp:1509 Aura::TriggerSpell sets triggerCaster to the Aura's target and changes it only for a channeled spell; tick_auras queues every A_PERIODIC_TRIGGER tick with the Aura's caster_guid."

[[known_gaps]]
description = "An Aura's periodic damage tick raises no procs. vmangos raises PROC_FLAG_DEAL_HARMFUL_PERIODIC for the caster and PROC_FLAG_TAKE_HARMFUL_PERIODIC for the target with PROC_EX_NORMAL_HIT, never PROC_EX_ABSORB, and adds PROC_FLAG_TAKEN_ANY_DAMAGE when damage remains after the absorb."
path = "module/src/spell/scheduler.rs"
symbol = "tick_auras"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp:5903-5917 Aura::PeriodicTick builds the periodic proc flags and calls ProcDamageAndSpell before DealDamage; module/src/spell/proc.rs defines no periodic proc flag and tick_auras runs no proc pass."

[[known_gaps]]
description = "An absorb Aura takes damage of every school. vmangos skips a SPELL_AURA_SCHOOL_ABSORB whose school mask misses the damage's school, so a Fire Ward takes no Shadow damage."
path = "module/src/spell/effects.rs"
symbol = "absorb_incoming"
evidence = "Source reading, not measured. At d9173eca, Unit.cpp:1967 Unit::CalculateDamageAbsorbAndResist tests mod->m_miscvalue & schoolMask for each absorb; absorb_incoming drains every A_ABSORB Aura of the target in id order."

[[known_gaps]]
description = "A health leech tick, such as Drain Life, heals its caster nothing and reports in SMSG_PERIODICAURALOG. vmangos heals the caster for the damage dealt times the effect's multiple value and reports the tick in SMSG_SPELLNONMELEEDAMAGELOG."
path = "importer/src/spell_kind.rs"
