[[known_gaps]]
description = "Tame Beast sends its SMSG_SPELL_START with the channel duration as a cast time, and sends its SMSG_SPELL_GO only when the channel completes. vmangos sends START, then the GO and MSG_CHANNEL_START when the channel begins."
path = "module/src/spell/cast/resolve.rs"
symbol = "begin_loaded_cast"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp Spell::cast calls handle_immediate for a channeled spell, which sends SMSG_SPELL_GO and then SendChannelStart. LyraCore: begin_loaded_cast schedules a completed_channel cast and inserts a Start row with cast_time_ms set to the duration; launch_cast sends the GO at completion."

[[known_gaps]]
description = "A Triggered Cast always sends SMSG_SPELL_START and SMSG_SPELL_GO. vmangos sends them for a triggered spell only when it has a spell visual, channels or travels."
path = "module/src/spell/cast/resolve.rs"
symbol = "launch_cast"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp:7705 Spell::IsNeedSendToClient returns true for a triggered spell only with SpellVisual, m_channeled or speed; SendSpellStart and SendSpellGo return early otherwise (Spell.cpp:4494, 4532)."

[[known_gaps]]
description = "A cast with an instant-kill or spawn effect sends its SMSG_SPELL_GO before its effects. vmangos sends that GO after the effects."
path = "module/src/spell/cast/resolve.rs"
symbol = "launch_cast"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp:3816-3822 Spell::handle_immediate sends SMSG_SPELL_GO before the effects unless the spell has SPELL_EFFECT_INSTAKILL or SPELL_EFFECT_SPAWN, and then sends it after them (Spell.cpp:3875-3876)."

[[known_gaps]]
description = "A Triggered Cast never reads an item target, so a triggered spell aimed at another player's trade-slot item is not refused when its caster lacks the reagents."
path = "module/src/spell/cast/resolve.rs"
