[[known_gaps]]
description = "Sweeping Strikes never spends its five charges: the Module strikes no second target, and vmangos spends a charge only for each strike."
path = "module/src/spell/proc.rs"
symbol = "dummy_proc"
evidence = "Source reading, not measured. At d9173eca, UnitAuraProcHandler.cpp Unit::HandleDummyAuraProc case 12292 casts 12723 at a random unit near the victim and returns SPELL_AURA_PROC_FAILED, keeping the charge, when it finds none; dummy_proc returns Failed for 12292 and 18765."

[[known_gaps]]
description = "A charged crit chance spell modifier, such as Cold Blood 14177, is spent by every cast whose crit roll would read it, even when the roll stops before it reads the modifier. vmangos keeps it when a weapon roll misses, is evaded or resisted, when the victim is a sitting Character, and when the cast reaches no unit target."
path = "module/src/spell/spell_modifier.rs"
symbol = "used_rows"
evidence = "Source reading, not measured. At d9173eca, SpellCaster::RollMeleeOutcomeAgainst returns on an evade (SpellCaster.cpp:433), a miss (:479) or a mechanic resist (:494) before it reads Unit::GetSpellCritChance (:506); a dodge, parry or block spends it, as the Module does. Unit::GetSpellCritChance returns 100 for a sitting Character victim before Player::ApplySpellMod (Unit.cpp:5299), and only Spell::AddUnitTarget rolls a spell crit. Player::DropModCharge runs only inside ApplySpellMod."

[[known_gaps]]
description = "A Trigger Child Cast uses and can spend a charged spell modifier that its parent cast already uses, because the parent spends its charges only after its effects. vmangos hides a charge that an in-flight cast took from every other cast."
path = "module/src/spell/spell_modifier.rs"
symbol = "ModifierCharges::used_by"
evidence = "Source reading, not measured. At d9173eca, Player::DropModCharge sets a mod's last charge to -1 when a cast takes it, and Player::IsAffectedBySpellmod refuses a mod at -1 to a cast that did not take it."

