[[known_gaps]]
description = "Furor's form-entry spell and Combustion's crit buff are Triggered Casts with no triggering spell, so they never carry reagents. vmangos gives each its Aura's spell as the triggering spell. No 1.12 spell data differs today."
path = "module/src/spell/proc.rs"
