[[known_gaps]]
description = "An effect-type immunity (aura 37) or an aura-state immunity (aura 38) refuses no effect. The importer keeps both as A_IMMUNITY rows with p0_kind P_RAW, and no immunity check reads them. 27 spells carry one."
