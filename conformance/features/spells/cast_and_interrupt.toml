symbol = "pushback_on_damage"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp Spell::Delayed and Spell::DelayedChannel add GetTotalAuraModifier(SPELL_AURA_RESIST_PUSHBACK); spell_template rows 19746 and 22812 carry aura 149, which importer/src/spell_kind.rs aura_mod_to_kind maps to A_FLAG."

[[known_gaps]]
description = "Damage pushes a cast back 500 ms at most twice. vmangos pushes it back 1000 ms, then 200 ms less for each later hit down to 200 ms, with no limit on the count, and never past the cast's full cast time."
path = "module/src/spell/control.rs"
symbol = "CAST_PUSHBACK_MS"
evidence = "Source reading, not measured. At d9173eca, Spell.cpp Spell::Delayed takes GetNextDelayAtDamageMsTime and caps m_timer at m_casttime. The Module's pending cast does not keep its full cast time, so it cannot apply the cap."

[[known_gaps]]
description = "Falling, drowning and fatigue damage neither push back a cast, cancel a channel whose flags say damage cancels it, nor end an Aura that damage breaks. vmangos deals environmental damage through DealDamage as SELF_DAMAGE, which does all three."
path = "module/src/world.rs"
symbol = "resolve_environmental_damage"
evidence = "Source reading, not measured. At d9173eca, Player.cpp Player::EnvironmentalDamage calls DealDamage(this, damage, nullptr, SELF_DAMAGE, ...). The Module's fall, breath and fatigue damage change health directly and never reach break_auras_on_damage or pushback_on_damage."

[[known_gaps]]
description = "A direct hit that a shield absorbs completely does not cancel a Character's cast whose spell has SPELL_INTERRUPT_FLAG_DAMAGE_CANCELS, such as Hearthstone or a mount, and does not end an Aura that damage breaks. vmangos does both for an absorbed non-DOT hit."
path = "module/src/combat/damage.rs"
symbol = "apply_hit"
evidence = "Source reading, not measured. At d9173eca, Unit.cpp Unit::DealDamage, for damage 0 with cleanDamage->absorb, calls RemoveAurasWithInterruptFlags(AURA_INTERRUPT_DAMAGE_CANCELS) and InterruptSpellsWithInterruptFlags(SPELL_INTERRUPT_FLAG_DAMAGE_CANCELS). The Module's deal_damage and apply_hit return before break_auras_on_damage and pushback_on_damage when the landed amount is 0."
