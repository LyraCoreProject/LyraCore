deliberate_deviations = [
  { id = "capped_area_effects_share_units", result = "Effects of a spell with MaxAffectedTargets that select the same units keep the same picks, MaxAffectedTargets 1 included. vmangos copies the units of an earlier effect with the same targets only when MaxAffectedTargets is above 1, so with 1 each effect picks its own random unit.", reason = "vmangos SetTargetMap says the copy exists so an area fear's speed and fear land on one unit, and its check of above 1 misses that case. One random draw per cast ranks the units for every effect.", source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Spells/Spell.cpp#L190-L193" },
]
