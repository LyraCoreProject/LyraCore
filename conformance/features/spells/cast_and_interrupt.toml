[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/Handlers/SpellHandler.cpp"
symbol = "WorldSession::HandleCastSpellOpcode"

[real_client]
status = "unverified"

[[known_gaps]]
description = "Only a create-item effect sends the SMSG_SPELLLOGEXECUTE execute log; vmangos also logs power drain, heal, energize, extra attacks, interrupt, dispel, resurrect, summon and other effects."
path = "module/src/spell/cast/resolve.rs"
symbol = "finish_item_creation"
evidence = "vmangos SpellEffects.cpp calls AddExecuteLogInfo from many effect handlers; EffectCreateItem is the only one covered. cast_and_interrupt tier 1 with conformance.19 has no remaining signatures, so the scenario cannot show the difference."

[[known_gaps]]
description = "A triggered create-item cast differs from vmangos in three ways. Its item push goes out before SMSG_SPELL_GO and keeps the looted flags, where DoCreateItem sends SendNewItem(item, count, true, true) after GO. Its execute log is sent unconditionally, where vmangos sends it only when IsNeedSendToClient() holds (a visual, a channel, a speed or a non-triggered cast) and never with a SCHOOL_DAMAGE effect."
path = "module/src/spell/cast/resolve.rs"
symbol = "run_spell_effects"
evidence = "vmangos Spell.cpp _handle_immediate_phase (m_needSpellLog) and IsNeedSendToClient, SpellEffects.cpp DoCreateItem at d9173eca. The recorded scenario casts from the client, so tier 1 has no triggered create-item packets."

[[known_gaps]]
description = "The execute log writes one block per created item, and a scripted create-item spell is logged under a spell id whose Spell.dbc effect is not 24. vmangos groups the entries of one effect index under a single block with a count."
path = "module/src/native/spell.rs"
symbol = "item_creation_log_message"
evidence = "vmangos Server/Packets/Spell.cpp SpellLogExecute::AppendBodyTo groups ExecuteLogInfo per effect index; Conjure Water creates one item per effect, so the scenario's bytes match."

[[known_gaps]]
description = "Entering a Form that acts as shapeshifted keeps the Auras whose spell carries AURA_INTERRUPT_SHAPESHIFTING_CANCELS; vmangos removes them. The importer keeps only the damage and movement interrupt bits."
path = "importer/src/spell.rs"
symbol = "aura_interrupt_bits"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp Aura::HandleAuraModShapeshift calls RemoveAurasWithInterruptFlags(AURA_INTERRUPT_SHAPESHIFTING_CANCELS) for a form without SHAPESHIFT_FLAG_STANCE."

[[known_gaps]]
description = "Entering or leaving a feral Form ends a movement slow whose spell has SpellIconID 15, dispel type 0 and no snare mechanic; vmangos keeps it as a daze. The Module does not store the icon id."
path = "module/src/form/mod.rs"
symbol = "clear_snares"
evidence = "Source reading, not measured. At d9173eca, SpellEffects.cpp Spell::EffectScriptEffect for Shapeshift Form Effect 9033 skips such slows alongside MECHANIC_NOT_REMOVED_BY_SHAPESHIFT."

[[known_gaps]]
description = "Leader of the Pack does nothing: a druid who knows 17007 gets no 24932 party Aura in Cat, Bear or Dire Bear Form. The Form passives apply only to the unit itself, and 24932 is a party area Aura gated on a known talent, which no Form building block expresses."
path = "module/src/form/mod.rs"
symbol = "reconcile_passives"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp Aura::HandleShapeshiftBoosts casts 24932 (SPELL_EFFECT_APPLY_AREA_AURA_PARTY, +3% crit, Stances 0x91) when the player HasSpell(17007) and 24932's Stances names the form."

[[known_gaps]]
description = "Heart of the Wild adds no Form bonus: a druid with the talent gets no 24900 Strength bonus in Cat Form and no 24899 Stamina bonus in Bear or Dire Bear Form. Both effect spells have base points -1 and take their amount from the talent rank's Aura, and no building block casts a spell with an amount another Aura supplies."
path = "module/src/form/mod.rs"
symbol = "reconcile_passives"
evidence = "Source reading, not measured. At d9173eca, SpellAuras.cpp Aura::HandleShapeshiftBoosts finds the SPELL_AURA_MOD_TOTAL_STAT_PERCENTAGE Aura with SpellIconID 240 and misc 3 and casts HotWSpellId with CastCustomSpell at that Aura's amount."

[[known_gaps]]
description = "Moonkin Aura reaches only the druid: Moonkin Form's trigger spell 24907 gives the druid +3% spell crit but no party member. The Module applies a party area Aura to its caster alone."
path = "module/src/spell/cast/targeting.rs"
symbol = "aura_has_visible_slot"
evidence = "Source reading, not measured. At d9173eca, 24907 is SPELL_EFFECT_APPLY_AREA_AURA_PARTY with SPELL_AURA_MOD_SPELL_CRIT_CHANCE, which vmangos AreaAura::Update gives to party members in range."

[[known_gaps]]
description = "A percent of base armor adds as flat armor: Bear Form 1178 adds 180 armor, and Dire Bear Form 9635 and Moonkin Form 24905 add 360, where vmangos multiplies the armor from items by 2.8 or 4.6."
path = "importer/src/spell_kind.rs"
symbol = "aura_mod_to_kind"
evidence = "Source reading, not measured. SPELL_AURA_MOD_BASE_RESISTANCE_PCT (142) imports as A_MOD_RESISTANCE, which module/src/modifiers/resistance.rs sums as a flat amount. At d9173eca, Aura::HandleAuraModBaseResistancePercent applies it as BASE_PCT on the armor unit modifier."

[[known_gaps]]
description = "Travel Form can be entered and kept in deep water, and Aquatic Form on land; vmangos refuses the cast and ends the Form when the unit enters or leaves water. Aquatic Form's water breathing (aura 82 of 5421) does not stop the breath timer."
path = "importer/src/spell.rs"
symbol = "aura_interrupt_bits"
evidence = "Source reading, not measured. 783 carries AURA_INTERRUPT_UNDER_WATER_CANCELS (0x80) and 1066 AURA_INTERRUPT_ABOVE_WATER_CANCELS (0x100); the importer keeps only the damage and movement bits. At d9173eca, Spell::CheckCast returns SPELL_FAILED_ONLY_ABOVEWATER or SPELL_FAILED_ONLY_UNDERWATER, and Player::SetEnvironmentFlags removes such Auras. module/src/breath.rs reads no Aura."

[[known_gaps]]
description = "Spirit of Redemption is not a Form: its shapeshift effect for Form 32 still imports as a flag, so a priest who dies with the talent neither becomes the spirit nor gets passives 27792 and 27795."
path = "crates/lyracore-shared/src/form.rs"
symbol = "FORM_FACTS"
evidence = "Source reading, not measured. At d9173eca, 27827 enters FORM_SPIRITOFREDEMPTION when the priest would die (Unit::Kill) and Aura::HandleShapeshiftBoosts adds 27792 and 27795; the Module has no building block that replaces a death."
