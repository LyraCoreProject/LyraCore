[[known_gaps]]
description = "When PLAYER_FLAGS changes, the Module also sends the unchanged UNIT_BYTES_1 field."
path = "crates/lyracore-protocol/src/codec/values.rs"
symbol = "build_player_flags_values"
evidence = "taxi_single_hop Tier 1 extra_packet / flight / broadcast/values / 0x00A9 / objects.0.values.field_138. The Golden Trace sends only field_190 = 0. At d9173eca3ea08dd985c52dabbcc826898d1d0b77, Player.cpp::SetRestType changes PLAYER_FLAGS without writing UNIT_BYTES_1."

[[known_gaps]]
description = "The Module sends an empty world-state list when the Character enters Elwynn and Westfall."
path = "crates/lyracore-protocol/src/codec/char.rs"
symbol = "build_init_world_states"
evidence = "taxi_single_hop Tier 1 data signature zone_world_state_catalogue / flight / broadcast/zones / 0x02C2 / states: each Golden Trace list has 164 entries, while the Module serializes a zero count. The first 109 entries match the unconditional def_world_states defaults sent by Player.cpp::SendInitWorldStates at d9173eca3ea08dd985c52dabbcc826898d1d0b77."

[[known_gaps]]
description = "Leaving Stormwind changes the Module's PLAYER_BYTES_2 rest-state byte, but the Golden Trace does not send that field."
path = "module/src/rest.rs"
symbol = "check_rest_state"
evidence = "taxi_single_hop Tier 1 extra_packet / flight / broadcast/values / 0x00A9 / objects.0.values.field_194. The Golden Trace sends only field_190 = 0. At d9173eca3ea08dd985c52dabbcc826898d1d0b77, Player.cpp::SetRestBonus changes the rest-state byte when rested XP changes, while SetRestType changes PLAYER_FLAGS."
