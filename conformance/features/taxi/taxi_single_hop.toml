[[known_gaps]]
description = "Reconnect weather is not controlled by the scenario. In the 2026-11-05 narrow audit on 311a3858, zone_weather_sound / 0x02F4 expected 0 and received 8556 twice; zone_weather_type expected 0 and received 3 twice. The Golden Trace and fresh Reference capture both have fine weather, while the imported candidate has a light sandstorm. Weather::ReGenerate selects weather independently and Weather::GetSound maps that state to 8556. The after-fix audit on b38526fa instead received sound 8533 and type 1 twice (light rain), again against expected 0/0; weather remains uncontrolled. On 8f0e832f (harness 004d8d7), candidate, Golden and fresh Reference all send fine weather, sound 0 and type 0, so both data signatures are absent in this sample; no weather control was added. A scenario author must control or separately measure weather; this is a fixture difference, not a taxi rule failure."
path = "module/src/weather.rs"
symbol = "WeatherState"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Weather.cpp"

[[known_gaps]]
description = "Historical G19 inventory high-word findings at fields 493, 499, 501 and 519 are absent on 311a3858 with harness 55252ab. The raw expected high word remains 1073741824 and actual remains 1073774592. These are halves of allocated item identities, not scalar Character state. The existing harness now joins both halves before identity comparison. ObjectGuid identifies item type through high tag 0x4000. No new rule or allocator change is needed. This records the resolved comparison defect for scenario authors."
path = "crates/lyracore-protocol/src/codec/entity.rs"
symbol = "build_self_create_object"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/ObjectGuid.h"

[[known_gaps]]
description = "Historical G21 field_shape at fields 534/535 and G26 reconnect_item_534 are absent on 311a3858 after the Hearthstone fix. The fresh reconnect CREATE has a slot-24 item in both captures: Reference fields 534/535 are 14/1073741824, candidate fields are 5/1073774592; each resolves to its existing item CREATE with entry 6948. Allocated identities differ, but item presence and identity continuity match. No current fixture correction is needed for these resolved findings."
path = "module/src/items/tables.rs"
symbol = "ItemInstance"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp"

[[known_gaps]]
description = "The Tier 1 reconnect fixture lacks the imported race-1/class-1 Human Spirit passive 20598 and the hostile creature 478 beside the saved flight position. Golden expects Spirit 21 rather than the fixture's 20, a combat-bearing login CREATE (field 46 = 524296), taxi-plus-combat VALUES (1572876), attack-stop 0x0144 and a later combat-clear VALUES (1048588). The corrected Module in the sparse fixture instead sends CREATE flags 8 and a single taxi VALUES 1048588 at 40000 ms, with no attack-stop. Pairing that VALUES with Golden's combat clear at 41537 ms exposes reconnected_mount_delivery / 0x00A9 / field_46, a 1537 ms difference against the existing 1150 ms bound. The fixture cannot show those imported-world fixes. The imported-world audit on b38526fa (harness 55252ab) has NPC entry 478, GUID 17379390970042333805, at (-9821.5195, 620.2778, 41.6081). Actor field 46 is 524296 at 40053 ms, 1572876 at 40056 ms, then 1048588 at 41246 ms: the combat clear is 291 ms before Golden 41537 ms and passes the unchanged bound. Attack-stop is present at 40056 ms, and Spirit is 21. A fresh Reference capture clears at 41508 ms and has zero differences from Golden. This confirms the Tier 1 timing signature as a fixture artefact; signature acceptance remains a maintainer decision and the label is unset. The scenario author must add an aggressive creature-478 template/spawn with hostile faction-template 20 near the Golden spawn (-9824.2998, 620.7950, 41.6051), plus passive spell 20598, its effect and race-1/class-1 starting link. Durable tests supply both inputs. A second audit on a6306073 reuses the sealed snapshot: CREATE 524296 at 40175 ms, mounted 1572876 at 40179 ms, combat clear 1048588 at 41351 ms, 186 ms before Golden and within the same bound. Attack-stop is present and attack-start replay is absent. Fresh Reference again has zero differences. The 8f0e832f audit (harness 004d8d7) has CREATE 524296 at 40087 ms, mounted 1572876 at 40089 ms and combat clear 1048588 at 41293 ms, 244 ms before Golden and within the unchanged 1150 ms bound. NPC 478 sends attack-stop at 40089 ms; Spirit is 21, the 78 ordinary-passive aura VALUES signatures are absent, and field 1181 stays at its implicit zero without sheet replay. Fresh Reference clears at 41436 ms and has zero differences from Golden. Separate known gaps record shared crit calculations and login timing."
path = "module/tests/conformance/tier1.rs"
symbol = "taxi_single_hop__reconnect_matches_its_golden_trace"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/CharacterHandler.cpp"

[[known_gaps]]
description = "The b38526fa imported-world audit exposes passenger_update_delivery / 0x00A9 for actor/flight/broadcast-values with an empty field path: expected login CREATE at 40256 ms, actual 40053 ms, 203 ms against the unchanged 150 ms bound. Fresh Reference CREATE is 40228 ms and its full comparison has zero differences from Golden. The later field-46 combat clear matches its separate bound and does not settle this login timing signature. In the a6306073 warm audit the CREATE arrives at 40175 ms (81 ms early), so the signature is absent; fresh Reference arrives at 40290 ms and again conforms. This establishes local delivery variation, not Reference instability. The correct login scheduling or scenario timing authority for the first sample remains unsettled; no delay, tolerance or rule change is proposed. On 8f0e832f (harness 004d8d7), CREATE arrives at 40087 ms: 169 ms early, 19 ms outside the same bound. Fresh Reference arrives at 40257 ms and has zero differences. The signature already exists in the committed November 4 full audit and recurs with local timing variation. A maintainer must classify this independently of the confirmed Tier 1 NPC fixture artefact."
