[[known_gaps]]
description = "LyraCore does not import vmangos's taxi_path_transitions, so every joint between two legs uses the vmangos default: the first leg up to its next-to-last point, the next leg from its second point. A route with a transition row in vmangos joins its legs at other points, so the client sees a different spline near that junction."
path = "module/src/taxi.rs"
symbol = "RoutePoints::join"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp"

