[[deliberate_deviations]]
id = "offered_item_stays_in_the_trade"
result = "The Auction House, destroy, vendor sale, permanent enchanting and Feed Pet refuse an item offered in a Trade Session, any other change to an offered item resets both accepts and resends the offer, and a Trade Commit whose offered item is gone or has another owner cancels the trade for both Characters. The Reference Server lets the Auction House, destroy, vendor sale and Feed Pet take an offered item and lets a permanent enchant overwrite one without resetting the accepts. Its HandleAcceptTradeOpcode then skips the slot, because TradeData::GetItem finds no item for it, so the partner pays for nothing."
reason = "The partner accepted a specific item. An offered item that leaves or changes must not let the trade complete without it."
source = "https://github.com/vmangos/core/blob/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Handlers/TradeHandler.cpp#L308-L338"
