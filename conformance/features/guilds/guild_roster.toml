[[deliberate_deviations]]
id = "moved_member_counts_online"
result = "A guild member whose World Session a cross-Shard Transfer has moved keeps its stored online state: the departure sends no sign-off and no logout time, and the destination's online report sends no sign-on and no MOTD. Until that report the roster shows the member online and an invite by name finds it. A member that disconnects after the move counts offline once its World Session close reaches the Realm Shard."
reason = "The Realm Shard hears that the member is in the world only after its client is. The Reference Server has no Transfer and announces sign-off and sign-on only for logout and login."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Server/WorldSession.cpp"

