[[deliberate_deviations]]
id = "mail_takes_only_bag_items"
result = "Mail answers MAIL_ERR_INTERNAL_ERROR for any attachment outside an unequipped bag slot. The Reference Server also refuses a bank item and an equipped bag, but mails an unbound equipped item the Character can unequip and unequips it."
reason = "The 1.12 client attaches only bag items, so only a modified client sends an equipped item. Refusing it keeps the Module from deleting equipped gear without recomputing the Character's stats."
