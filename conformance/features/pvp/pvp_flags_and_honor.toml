[[known_gaps]]
description = "The Module returns an unavailable response for MSG_INSPECT_HONOR_STATS."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "The PvP Flag and PVP_DESIRED do not survive logout or Transfer; world entry rebuilds the Character's entity without them."
path = "module/src/world/character_entity.rs"
symbol = "build_player_entity"
evidence = "At d9173eca, Player.cpp Player::UpdateCharacterFlags stores CHARACTER_FLAG_PVP_ENABLED and CHARACTER_FLAG_PVP_DESIRED, and Player::LoadFromDB calls UpdatePvP(true) and SetPvPDesired(true) from them."

[[known_gaps]]
description = "A taxi flight keeps the PvP Flag; vmangos drops it at take-off unless PVP_DESIRED is set."
path = "module/src/taxi.rs"
symbol = "activate_route"
evidence = "At d9173eca, Player.cpp Player::ActivateTaxiPathTo calls UpdatePvP(false, true) when IsPvPDesired() is false."

[[known_gaps]]
description = "A Character's pets and totems do not carry its UNIT_FLAG_PVP, so their unit frames show no PvP icon; harm and help checks already use the owner's flag."
path = "module/src/pvp.rs"
symbol = "affecting_character"
evidence = "At d9173eca, Unit.cpp Unit::SetPvP applies the flag to every controlled unit through SetPvPHelper."
