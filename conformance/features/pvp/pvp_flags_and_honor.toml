[[known_gaps]]
description = "The Module returns an unavailable response for MSG_INSPECT_HONOR_STATS."
path = "module/src/native/unavailable.rs"
symbol = "responses"
evidence = "module/src/native/unavailable.rs; docs/benilla-compatibility.md#missing-gameplay-and-deliberate-responses"

[[known_gaps]]
description = "Help to a flagged Character in combat flags the helper for every spell; vmangos skips a spell with SPELL_ATTR_EX_NO_THREAT, and game_spell has no attributes_ex column to read it from."
path = "module/src/pvp.rs"
symbol = "spell_targeted"
evidence = "At d9173eca, Spell.cpp Spell::DoSpellHitOnUnit calls SetInCombatWithAssisted only when the spell lacks SPELL_ATTR_EX_NO_THREAT."

[[known_gaps]]
description = "A Character's pets and totems do not carry its UNIT_FLAG_PVP, so their unit frames show no PvP icon; harm and help checks already use the owner's flag."
path = "module/src/pvp.rs"
symbol = "affecting_character"
evidence = "At d9173eca, Unit.cpp Unit::SetPvP applies the flag to every controlled unit through SetPvPHelper."
