[[deliberate_deviations]]
id = "moved_member_counts_online"
result = "A Group member on a cross-Shard loading screen counts as online once the Character directory names its destination, so a reset is not refused with INSTANCERESET_FAIL_OFFLINE; a member loading into the dungeon still refuses it with INSTANCERESET_FAIL_GENERAL. The Reference Server counts a member offline until it is in the world."
reason = "The Realm Shard hears that the member is in the world only after its client is. Counting the moved World Session online keeps a reset sent right after the member's arrival from being refused; the admission reservation still protects the dungeon while a member loads into it."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Group/Group.cpp"

