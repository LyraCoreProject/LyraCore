[[known_gaps]]
description = "On a split Realm a Shard hands over only the runs and bindings it holds, so the formation and leader-change handovers of vmangos Group::Create and Group::_setLeader need the run and the leader's binding on one Shard. A leader outside the dungeon holds its binding on a continent World Shard while its solo run is on the Instance Shard: the Group takes that run only when the leader enters it first, a new leader outside the dungeon does not take the Group to its own run, and an old leader on another Shard does not keep the Group's former run. With several Instance hosts for one map, a run the Group adopts on one host is not the Group's Instance Placement, so the Realm Shard can send a member to a fresh run on another host."
path = "module/src/instance.rs"
symbol = "hand_runs_to_leader"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Group/Group.cpp"

[[known_gaps]]
description = "When the leader leaves the Group and the new leader holds its own run of a map, vmangos Group::_setLeader gives the Group's run to the leaver. The members still standing in that run stay in vmangos, because its countdown starts only for the leaver in Group::_homebindIfInstance. LyraCore checks its countdown from the run's owner, so those members stand in the leaver's run outside its Group and count down."
path = "module/src/instance.rs"
symbol = "hand_runs_to_leader"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Group/Group.cpp"

[[known_gaps]]
description = "vmangos Group::_setLeader gives the Group's run to the old leader only when the old leader is online. LyraCore gives it to an offline old leader whose Character is on the Shard that runs the leader change."
path = "module/src/instance.rs"
symbol = "hand_runs_to_leader"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Group/Group.cpp"

[[known_gaps]]
description = "When the leader leaves the Group while it stands in the Group's run and the new leader holds its own run of that map, the leaver keeps the run as in vmangos Group::_setLeader. vmangos Group::_homebindIfInstance then counts the leaver down, because its bind is not permanent. LyraCore lets the holder stay, so the leaver gets no countdown."
path = "module/src/instance.rs"
symbol = "instance_removal_standing"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Group/Group.cpp"

[[known_gaps]]
description = "A join that reaches the Shards while the joiner is between them skips the vmangos Player::ResetInstances(INSTANCE_RESET_GROUP_JOIN) reset. The joiner, with a solo run R0, is exported from one World Shard and not yet imported on the next; the joiner accepts an invite; each Shard projects the membership but holds no Character to reset; the joiner arrives with its R0 binding, later projections see no change of Group, and the Group adopts R0 when the joiner enters it."
path = "module/src/native/realm_party.rs"
symbol = "project"
evidence = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Player.cpp"

[[known_gaps]]
description = "A join that crosses an in-flight dungeon admission gives the joiner's solo run to the Group, where vmangos Player::ResetInstances(INSTANCE_RESET_GROUP_JOIN) would have reset it. The entry is queued with the binding to the solo run R0; the joiner joins a Group before the Realm Shard handles the entry; the Instance Shard applies the snapshot that makes the joiner a member, binds the carried R0 binding, routes the joiner into R0 and gives R0 to the Group."
