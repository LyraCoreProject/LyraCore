description = "Each Shard follows its own event starts, so a Character that changes Shard can get an event's start letter twice or not at all: a Transfer under way while the two Shards' passes see the start, a Transfer that ends while a mailing is queued, or two Shards with different Operator holds, can mail it from both or neither. The Reference Server is one world server that mails each Character once per start."
