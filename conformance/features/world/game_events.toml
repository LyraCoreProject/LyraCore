[vmangos]
commit = "d9173eca3ea08dd985c52dabbcc826898d1d0b77"
path = "src/game/GameEventMgr.cpp"
symbol = "GameEventMgr::Update"

[real_client]
status = "unverified"

[[deliberate_deviations]]
id = "yearly_event_keeps_its_calendar_date"
result = "A yearly event shorter than a year skips each 29 February from its start up to now, so it comes back on the calendar date and time of its start. The Reference Server counts the leap years from the start year up to the year before now when it loads, so an event that starts after February in a leap year runs a day late in the following years, one that starts before March runs a day early from 29 February of a later leap year, and a server running into a new year keeps the old count."
reason = "The count only exists to keep yearly events on their date; counting the 29 Februaries the event has actually crossed does that every year."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

[[deliberate_deviations]]
id = "boundary_within_a_minute"
result = "An event starts or stops on the first minute pass at or after its boundary, up to a minute late. The Reference Server schedules its next check one second after the nearest boundary of an event its calendar runs; the Darkmoon Faire's boundaries are in darkmoon_faire_on_the_utc_date."
reason = "One pass a minute keyed to the Realm Clock corrects a missed firing on its own and needs no per-event timer."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

[[deliberate_deviations]]
id = "darkmoon_faire_on_the_utc_date"
result = "The Darkmoon Faire's building and open events switch on the first minute pass after midnight of the Realm Clock's UTC date. Each of the four events is unscheduled while its own row is disabled, and an Operator start or stop holds over the Faire's schedule until cleared. The Reference Server reads the date in the server's local time and runs the Faire script only on its next GameEventMgr::Update, which can come up to 86,400 seconds (max_ge_check_delay) later, so it can switch hours late; it runs the script only while event 4 is not disabled and does not check the other three events' flags, and its script stops a manually started Faire event on its next update. The pinned World Source disables none of the four events."
reason = "The Realm Clock is UTC, as for every imported event time; one minute pass keeps every boundary within a minute; and an Operator hold that the schedule cannot undo is the decided Operator contract for every Game Event in #1320."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/HardcodedEvents.cpp"

[[deliberate_deviations]]
id = "spawn_of_several_events"
result = "A spawn tied to several events shows while any of them runs and no event it is tied to the absence of runs. The Reference Server spawns it when any of its events starts and removes it when any stops, so it can vanish while another of its events still runs. 153 creatures and 696 GameObjects in the pinned World Source have several links."
reason = "The Reference Server result depends on the order its events start and stop; a rule over the current states gives one answer for one calendar."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

[[deliberate_deviations]]
id = "creature_data_of_several_events"
result = "A creature spawn with creature data rows for several running events takes the template and equipment of the first row, in source guid then event order, that names one, and the start spell of every row. The Reference Server applies the row of the event that started last, and the first row when the creature respawns, so a Stormwind City Patroller loses its Night lantern when Love is in the Air starts at night. Here a stop of either event leaves the creature in the other's data; the Reference Server's stop returns it to its own template and equipment (UpdateEntry with its original entry) while the other event still runs. 9 creatures in the pinned World Source have rows for two events."
reason = "The Reference Server result depends on the order its events start and stop; a rule over the current states gives one answer for one calendar, as for spawns of several events."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

[[deliberate_deviations]]
id = "creature_data_at_respawn"
result = "A creature that respawns while its event runs comes back with all of its event data, its start spells included. The Reference Server's in-place respawn casts the start spell again only when it changes the creature's entry, so a creature whose row only casts a spell, such as a Lunar Festival vendor's costume, respawns without it until the event starts again."
reason = "The start spell is part of what the creature takes while its event runs; casting it at every spawn gives the same creature for the same calendar. The Reference Server also casts it again on every grid load (Creature::LoadFromDB, Create, UpdateEntry, ApplyGameEventSpells), so there the creature lacks it only until its grid next loads, and LyraCore never unloads grids."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/Objects/Creature.cpp"

