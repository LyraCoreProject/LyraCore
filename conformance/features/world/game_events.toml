[[deliberate_deviations]]
id = "yearly_event_keeps_its_calendar_date"
result = "A yearly event shorter than a year skips each 29 February from its start up to now, so it comes back on the calendar date and time of its start. The Reference Server counts the leap years from the start year up to the year before now when it loads, so an event that starts after February in a leap year runs a day late in the following years, one that starts before March runs a day early from 29 February of a later leap year, and a server running into a new year keeps the old count."
reason = "The count only exists to keep yearly events on their date; counting the 29 Februaries the event has actually crossed does that every year."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

[[deliberate_deviations]]
id = "boundary_within_a_minute"
result = "An event starts or stops on the first minute pass at or after its boundary, up to a minute late. The Reference Server schedules its next check one second after the nearest boundary."
reason = "One pass a minute keyed to the Realm Clock corrects a missed firing on its own and needs no per-event timer."
source = "https://raw.githubusercontent.com/vmangos/core/d9173eca3ea08dd985c52dabbcc826898d1d0b77/src/game/GameEventMgr.cpp"

