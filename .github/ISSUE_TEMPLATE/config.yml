# Blank issues stay enabled on purpose: the maintainers file most of the queue themselves, in the
# expected/actual/how it shows/fix direction shape CONTRIBUTING.md describes, and the forms are
# aimed at people reporting from the outside.
blank_issues_enabled: true
contact_links:
  - name: Troubleshooting guide
    url: https://github.com/LyraCoreProject/LyraCore/blob/main/docs/quickstart.md#8-troubleshooting
    about: One entry per known failure mode, keyed to the exact message it prints. Check here first.
  - name: Report a security vulnerability
    url: https://github.com/LyraCoreProject/LyraCore/security/advisories/new
    about: Private advisory thread. Do not report security problems in a public issue — several weaknesses are already known and accepted for this alpha's local-development-only posture, so check the advisory isn't a duplicate first.
