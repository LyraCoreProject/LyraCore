name: Module durable tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UPGRADE_BASELINE: 859c7257c74d2c371dea8ed743cfbccd596cac11
  UPGRADE_BASELINE_WASM: ${{ github.workspace }}/.lyracore-upgrade-baseline.wasm

jobs:
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/setup-spacetime

      - name: Test the CI scripts
        if: matrix.shard == 0
        run: python3 -m unittest discover -s scripts/tests

      - name: Build the module wasm
        run: cargo build --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers,package_test_fixture,conformance_test_fixture

      # Each test owns a standalone process; the thread limit bounds memory use.
      - name: Run the durable suite, shard ${{ matrix.shard }} of 3
        run: |
          mapfile -t targets < <(python3 scripts/durable-test-targets.py "${{ matrix.shard }}")
          [ "${#targets[@]}" -gt 0 ]
          args=()
          for target in "${targets[@]}"; do args+=(--test "$target"); done
          echo "targets: ${targets[*]}"
          cargo test -p lyracore-module "${args[@]}" -- --ignored --test-threads=4 --skip deadmines --skip populated_old_module_upgrades_without_clearing

      - id: baseline-cache
        if: matrix.shard == 2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPGRADE_BASELINE_WASM }}
          key: durable-upgrade-baseline-${{ env.UPGRADE_BASELINE }}

      - name: Check out the populated-upgrade baseline
        if: matrix.shard == 2 && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.UPGRADE_BASELINE }}
          path: .lyracore-upgrade-baseline
          persist-credentials: false

      - name: Build the populated-upgrade baseline
        if: matrix.shard == 2 && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          baseline_target="$RUNNER_TEMP/lyracore-upgrade-baseline-target"
          cargo build --manifest-path .lyracore-upgrade-baseline/Cargo.toml --target-dir "$baseline_target" --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers,package_test_fixture
          cp "$baseline_target/wasm32-unknown-unknown/release/lyracore_module.wasm" "$UPGRADE_BASELINE_WASM"

      - name: Verify the populated Module upgrade
        if: matrix.shard == 2
        env:
          LYRACORE_TEST_BASELINE_WASM: ${{ env.UPGRADE_BASELINE_WASM }}
        run: cargo test -p lyracore-module --test additive_upgrade populated_old_module_upgrades_without_clearing -- --ignored --exact --test-threads=1

      - name: Upload the standalone logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-logs-${{ matrix.shard }}
          path: /tmp/lyracore-standalone-logs
          if-no-files-found: ignore
