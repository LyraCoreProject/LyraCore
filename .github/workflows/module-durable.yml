name: Module durable tests and Gateway bindings

# Durable tests start private SpacetimeDB instances and publish the Module with test fixtures.
# The Rust workflow's --lib run does not execute these ignored integration tests.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # docs/quickstart.md and install.sh pin this exactly; `lyracore preflight` enforces the match.
  SPACETIME_VERSION: 2.7.1
  # Digest of the x86_64 Linux archive in the upstream v2.7.1 GitHub release.
  SPACETIME_ARCHIVE_SHA256: 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1

jobs:
  # Balance measured target durations, reserving time for each job's builds and Gateway checks.
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Each test uses its own temporary CLI configuration.
      - name: Install SpacetimeDB ${{ env.SPACETIME_VERSION }}
        timeout-minutes: 3
        run: |
          archive_path="$RUNNER_TEMP/spacetime.tar.gz"
          cli_dir="$RUNNER_TEMP/spacetime-$SPACETIME_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v$SPACETIME_VERSION/spacetime-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$SPACETIME_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$cli_dir"
          tar --extract --gzip --file "$archive_path" --directory "$cli_dir"
          ln -s spacetimedb-cli "$cli_dir/spacetime"
          echo "$cli_dir" >> "$GITHUB_PATH"

      # Verify the downloaded CLI matches the version required by the Module.
      - name: Check the pinned version
        run: |
          found=$(spacetime --version | sed -n 's/.*version[ ]*\([0-9][0-9.]*\).*/\1/p' | head -n 1)
          echo "spacetime $found"
          [ "$found" = "$SPACETIME_VERSION" ]

      - name: Test the CI scripts
        if: matrix.shard == 0
        run: python3 -m unittest discover -s scripts/tests

      # This regenerates the complete private schema into a temporary directory. It does not need a
      # running Realm and never publishes the Module.
      - name: Check all Gateway bindings
        if: matrix.shard == 0
        run: scripts/check-gateway-bindings.py

      # Build failures report before any fixture starts. Each test process asks Cargo for the
      # current artifact, caches its bytes, and publishes private copies through --bin-path.
      - name: Build the module wasm
        run: cargo build --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers,package_test_fixture

      # Each test owns a whole database process, so the thread cap is a memory bound, not a CPU one.
      #
      # Deadmines fixtures need the separately installed Package's reducers.
      # `lethal_floor`'s ranged phase races the module's own cast-event sweep and health regen, and
      # is flaky on `main` with or without this change.
      - name: Run the durable suite, shard ${{ matrix.shard }} of 3
        run: |
          mapfile -t targets < <(python3 scripts/durable-test-targets.py "${{ matrix.shard }}")
          [ "${#targets[@]}" -gt 0 ]
          args=()
          for target in "${targets[@]}"; do args+=(--test "$target"); done
          echo "targets: ${targets[*]}"
          cargo test -p lyracore-module "${args[@]}" -- --ignored --test-threads=4 --skip deadmines --skip lethal_floor

      - name: Run the single-shard auction Refusal regression
        if: matrix.shard == 0
        run: |
          target_test=stdb::store::auction::auction_reducer_tests::a_local_bid_interaction_refusal_stays_a_client_outcome
          cargo test -p lyracore-gateway --bin lyracore-gateway "$target_test" -- --ignored --exact --list | grep -Fx "$target_test: test"
          cargo test -p lyracore-gateway --bin lyracore-gateway "$target_test" -- --ignored --exact

      - name: Run the Gateway ownership and durable projection regressions
        if: matrix.shard == 0
        run: |
          cargo test -p lyracore-gateway --bin lyracore-gateway stdb::account_sessions::tests::independent_coordinators_preserve_the_winner_after_delayed_cleanup -- --ignored --exact
          cargo test -p lyracore-gateway --bin lyracore-gateway world::tests::session_tests::competing_world_sessions_close_the_old_socket_without_removing_the_winner -- --ignored --exact
          cargo test -p lyracore-gateway --bin lyracore-gateway stdb::subscriptions::character_gone_durable_tests::another_gateway_waits_for_the_transfer_then_cleans_the_deleted_character -- --ignored --exact
          cargo test -p lyracore-gateway --bin lyracore-gateway stdb::subscriptions::roster_relay_durable_tests::a_roster_change_made_only_on_realm_core_reaches_every_world_shard_mirror -- --ignored --exact
          cargo test -p lyracore-gateway --bin lyracore-gateway stdb::subscriptions::meeting_stone_durable_tests::seekers_on_two_world_shards_form_one_party_that_reaches_every_mirror -- --ignored --exact
          cargo test -p lyracore-gateway --bin lyracore-gateway world::tests::shard_routing_durable_tests -- --ignored --test-threads=1
          cargo test -p lyracore-gateway --bin lyracore-gateway stdb::armor::tests::resistance_projection_adds_property_effects_only_while_the_item_is_worn_and_unbroken -- --ignored --exact
          cargo test -p lyracore-gateway --test provision_cli provision_writes_the_account_to_the_world_shard_and_realm_core -- --ignored --exact
          cargo test -p lyracore-gateway --test startup_relays -- --ignored --test-threads=1

      - name: Run Benilla against private Module instances
        if: matrix.shard == 0
        run: cargo test --locked -p lyracore-gateway --bin lyracore-gateway benilla_durable_ -- --ignored --test-threads=1

      # No Package registers a client command here, so the Module's fixture command carries it.
      - name: Run the cross-Shard command transport tests
        if: matrix.shard == 1
        run: cargo test -p lyracore-gateway --bin lyracore-gateway stdb::subscriptions::party_command_durable_tests -- --ignored --test-threads=1

      - name: Upload the standalone logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-logs-${{ matrix.shard }}
          path: /tmp/lyracore-standalone-logs
          if-no-files-found: ignore
