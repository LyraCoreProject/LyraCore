name: Native Host

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-spacetime
      - run: |
          toolchain=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' native-host/rust-toolchain.toml)
          test -n "$toolchain"
          echo "HOST_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$HOST_TOOLCHAIN" --profile minimal --component rustfmt
      - run: rustfmt +"$HOST_TOOLCHAIN" --edition 2021 --config skip_children=true --check native-host/src/*.rs
      - run: python3 native-host/prepare-host.py --checkout .lyracore/native-host/SpacetimeDB
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            .lyracore/native-host/SpacetimeDB -> target
      - name: Build the native Host
        run: python3 native-host/prepare-host.py --checkout .lyracore/native-host/SpacetimeDB --build
      - name: Check cached compilation limits and execution
        working-directory: .lyracore/native-host/SpacetimeDB
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo +"$HOST_TOOLCHAIN" test --release --locked -p spacetimedb-core --lib host::wasmtime::compile_cache::tests
      - name: Check recovery history retention
        working-directory: .lyracore/native-host/SpacetimeDB
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo +"$HOST_TOOLCHAIN" test --release --locked -p spacetimedb-engine --lib retention::tests
      - name: Build the Module
        run: cargo build --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
      - name: Check native protocol behavior
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone
      - name: Check development reload with connected clients
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone reload
      - name: Check cleanup and crash recovery during development reload
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone retention
      - name: Check long Login Queue waits
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone admission-wait
      - name: Check crash recovery
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone recovery
      - name: Check slow-reader isolation
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone slow-readers
      - name: Check listener recovery after descriptor exhaustion
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone accept-recovery
