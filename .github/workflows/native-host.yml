name: Native Host

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-spacetime
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: rustfmt +1.97.1 --edition 2021 --config skip_children=true --check native-host/src/mod.rs native-host/src/feed.rs native-host/src/wire.rs
      - run: python3 native-host/prepare-host.py --checkout .lyracore/native-host/SpacetimeDB
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            .lyracore/native-host/SpacetimeDB -> target
      - name: Build the native Host
        run: python3 native-host/prepare-host.py --checkout .lyracore/native-host/SpacetimeDB --build
      - name: Build the Module
        run: cargo build --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
      - name: Check native protocol behavior
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone
      - name: Check long Login Queue waits
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone --check-admission
      - name: Check crash recovery
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone --check-recovery
      - name: Check slow-reader isolation
        run: python3 native-host/check.py --host .lyracore/native-host/SpacetimeDB/target/release/spacetimedb-standalone --check-slow-readers
