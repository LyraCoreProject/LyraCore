name: Native Host

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  HOST_CHECKOUT: .lyracore/native-host/SpacetimeDB

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Host binary depends only on these inputs and the pinned SpacetimeDB revision.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spacetimedb-standalone
          key: native-host-${{ hashFiles('native-host/prepare-host.py', 'native-host/rust-toolchain.toml', 'native-host/*.patch', 'native-host/src/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-host-toolchain
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python3 native-host/prepare-host.py --checkout "$HOST_CHECKOUT"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .lyracore/native-host/SpacetimeDB -> target
      - name: Build the native Host
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 native-host/prepare-host.py --checkout "$HOST_CHECKOUT" --build
          cp "$HOST_CHECKOUT/target/release/spacetimedb-standalone" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-host
          path: spacetimedb-standalone
          if-no-files-found: error

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-host-toolchain
      - run: rustfmt +"$HOST_TOOLCHAIN" --edition 2021 --config skip_children=true --check native-host/src/*.rs
      - run: python3 native-host/prepare-host.py --checkout "$HOST_CHECKOUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .lyracore/native-host/SpacetimeDB -> target
      - name: Check cached compilation limits and execution
        working-directory: ${{ env.HOST_CHECKOUT }}
        run: cargo +"$HOST_TOOLCHAIN" test --release --locked -p spacetimedb-core --lib host::wasmtime::compile_cache::tests
      - name: Check recovery history retention
        working-directory: ${{ env.HOST_CHECKOUT }}
        run: cargo +"$HOST_TOOLCHAIN" test --release --locked -p spacetimedb-engine --lib retention::tests
      - name: Check delivery routing and the Module row layouts
        working-directory: ${{ env.HOST_CHECKOUT }}
        run: cargo +"$HOST_TOOLCHAIN" test --release --locked -p spacetimedb-standalone --lib native_world::feed::tests

  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the Module
        run: cargo build --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
      - name: Check the Module links no native code
        run: python3 scripts/module-env-imports.py target/wasm32-unknown-unknown/release/lyracore_module.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-module
          path: target/wasm32-unknown-unknown/release/lyracore_module.wasm
          if-no-files-found: error

  checks:
    needs: [host, module]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shared checks
            checks: ""
          - group: Login Queue and development reload
            checks: admission-wait reload
          - group: recovery
            checks: retention recovery slow-readers accept-recovery
          - group: Handoff
            checks: handoff realm-shard
          - group: continent Shards
            checks: continent-shards
    name: checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-host
          path: ${{ runner.temp }}/host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-module
          path: ${{ runner.temp }}/module
      - name: Run the native checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          chmod +x "$RUNNER_TEMP/host/spacetimedb-standalone"
          # shellcheck disable=SC2086
          python3 native-host/check.py --host "$RUNNER_TEMP/host/spacetimedb-standalone" \
            --module "$RUNNER_TEMP/module/lyracore_module.wasm" $CHECKS
