name: Propose harness pin bump

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: harness-pin-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      propose: ${{ steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false' }}
      sha: ${{ steps.proposal.outputs.sha }}
      baseline: ${{ steps.proposal.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Place scratch files on the runner disk
        run: |
          echo "LYRACORE_CONFORMANCE_SCRATCH=$RUNNER_TEMP/conformance" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Find the latest harness tag
        id: pin
        run: python3 conformance/pin_bump.py prepare --output "$GITHUB_OUTPUT"
      - name: Resolve the harness without running its code
        if: steps.pin.outputs.new == 'true'
        env:
          HARNESS_SHA: ${{ steps.pin.outputs.sha }}
        run: cargo update -p wire-client --precise "$HARNESS_SHA"
      - name: Check for scenarios without core tests
        if: steps.pin.outputs.new == 'true'
        id: catalogue
        run: python3 conformance/pin_bump.py catalogue --output "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
      - uses: ./.github/actions/setup-spacetime
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
      - name: Build the disposable Module
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
        run: cargo build --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers,package_test_fixture,conformance_test_fixture
      - name: Collect every tier 1 comparison
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
        run: |
          mkdir -p "$LYRACORE_CONFORMANCE_SCRATCH"
          cargo test -p lyracore-module --test native_conformance tier1:: -- --ignored --test-threads=1 || test "$?" -eq 101
      - name: Regenerate and verify the Tier 1 baseline
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
        run: |
          ./conformance/baseline
          cargo test -p lyracore-module --test native_conformance tier1:: -- --ignored --test-threads=1
      - name: Save the pin proposal data
        if: steps.pin.outputs.new == 'true' && steps.catalogue.outputs.missing == 'false'
        id: proposal
        run: python3 conformance/pin_bump.py proposal --output "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.propose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PROPOSAL_SHA: ${{ needs.prepare.outputs.sha }}
      BASELINE_B64: ${{ needs.prepare.outputs.baseline }}
      GIT_AUTHOR_NAME: LyraCore harness pin bot
      GIT_AUTHOR_EMAIL: harness-pin-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: LyraCore harness pin bot
      GIT_COMMITTER_EMAIL: harness-pin-bot@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and apply the proposal
        id: proposal
        run: |
          python3 conformance/pin_bump.py publish \
            --body "$RUNNER_TEMP/pin-bump.md" --output "$GITHUB_OUTPUT"
      - name: Resolve the lockfile and save the proposed files
        env:
          HARNESS_SHA: ${{ steps.proposal.outputs.sha }}
        run: |
          cargo update -p wire-client --precise "$HARNESS_SHA"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' .wire-harness-rev Cargo.lock Cargo.toml conformance/tier1-baseline.json | sort)"
          mkdir -p "$RUNNER_TEMP/proposal-files/conformance"
          cp .wire-harness-rev Cargo.toml Cargo.lock "$RUNNER_TEMP/proposal-files/"
          cp conformance/tier1-baseline.json "$RUNNER_TEMP/proposal-files/conformance/"
      - name: Push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.HARNESS_PIN_TOKEN }}
          HUMAN_REVIEW: ${{ steps.proposal.outputs.human_review }}
          HARNESS_TAG: ${{ steps.proposal.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/pin-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'x-access-token' ;;
            *Password*) printf '%s' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/pin-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/pin-askpass"
          export GIT_TERMINAL_PROMPT=0
          branch=ci/auto-harness-pin
          python3 conformance/pin_bump.py checkout --saved "$RUNNER_TEMP/proposal-files"
          git add .wire-harness-rev Cargo.toml Cargo.lock conformance/tier1-baseline.json
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(conformance): propose harness pin $HARNESS_TAG"
          fi
          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch" || \
              [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch")" ]; then
            git push origin "HEAD:refs/heads/$branch"
          fi
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create --head "$branch" --base main \
              --title "chore(conformance): propose harness pin $HARNESS_TAG" \
              --body-file "$RUNNER_TEMP/pin-bump.md"
            number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --title "chore(conformance): propose harness pin $HARNESS_TAG" \
              --body-file "$RUNNER_TEMP/pin-bump.md"
          fi
          if [ "$HUMAN_REVIEW" = true ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f 'labels[]=ready-for-human' >/dev/null
          elif gh pr view "$number" --json labels --jq '.labels[].name' | grep -qx ready-for-human; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$number/labels/ready-for-human" >/dev/null
          fi
