name: Propose harness pin bump

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: harness-pin-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: LyraCore harness pin bot
      GIT_AUTHOR_EMAIL: harness-pin-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: LyraCore harness pin bot
      GIT_COMMITTER_EMAIL: harness-pin-bot@users.noreply.github.com
    steps:
      - name: Check the bot credential
        env:
          GH_TOKEN: ${{ secrets.HARNESS_PIN_TOKEN }}
        run: test -n "$GH_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Place scratch files on the runner disk
        run: |
          echo "LYRACORE_CONFORMANCE_SCRATCH=$RUNNER_TEMP/conformance" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Find the latest harness tag
        id: pin
        run: python3 conformance/pin_bump.py prepare --output "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.pin.outputs.new == 'true'
      - uses: ./.github/actions/setup-spacetime
        if: steps.pin.outputs.new == 'true'
      - name: Regenerate the lockfile and record the tested commit
        if: steps.pin.outputs.new == 'true'
        run: |
          cargo update -p wire-client
          git add .wire-harness-rev Cargo.toml Cargo.lock
          git commit -m "chore(conformance): test ${{ steps.pin.outputs.tag }}"
      - name: Build the disposable Module
        if: steps.pin.outputs.new == 'true'
        run: cargo build --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers,package_test_fixture,conformance_test_fixture
      - name: Collect every tier 1 comparison
        if: steps.pin.outputs.new == 'true'
        run: |
          mkdir -p "$LYRACORE_CONFORMANCE_SCRATCH"
          cargo test -p lyracore-module --test native_conformance tier1:: -- --ignored --test-threads=1 || test "$?" -eq 101
      - name: Regenerate and verify the Tier 1 baseline
        if: steps.pin.outputs.new == 'true'
        run: |
          ./conformance/baseline
          cargo test -p lyracore-module --test native_conformance tier1:: -- --ignored --test-threads=1
      - name: Describe the comparison
        if: steps.pin.outputs.new == 'true'
        id: comparison
        run: python3 conformance/pin_bump.py describe --body "$RUNNER_TEMP/pin-bump.md" --output "$GITHUB_OUTPUT"
      - name: Open or update one pull request
        if: steps.pin.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.HARNESS_PIN_TOKEN }}
          HUMAN_REVIEW: ${{ steps.comparison.outputs.human_review }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pin-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'x-access-token' ;;
            *Password*) printf '%s' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/pin-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/pin-askpass"
          export GIT_TERMINAL_PROMPT=0
          branch=ci/auto-harness-pin
          git reset --soft origin/main
          git add .wire-harness-rev Cargo.toml Cargo.lock conformance/tier1-baseline.json
          git commit -m "chore(conformance): propose harness pin ${{ steps.pin.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if [ "$(git rev-parse HEAD^{tree})" != "$(git rev-parse "origin/$branch^{tree}")" ]; then
              git push --force-with-lease origin "HEAD:refs/heads/$branch"
            fi
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create --head "$branch" --base main \
              --title "chore(conformance): propose harness pin ${{ steps.pin.outputs.tag }}" \
              --body-file "$RUNNER_TEMP/pin-bump.md"
            number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --title "chore(conformance): propose harness pin ${{ steps.pin.outputs.tag }}" \
              --body-file "$RUNNER_TEMP/pin-bump.md"
          fi
          if [ "$HUMAN_REVIEW" = true ]; then
            gh pr edit "$number" --add-label ready-for-human
          elif gh pr view "$number" --json labels --jq '.labels[].name' | grep -qx ready-for-human; then
            gh pr edit "$number" --remove-label ready-for-human
          fi
