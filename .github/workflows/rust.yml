name: Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      # SpacetimeDB scans comments and test code for forbidden print macros.
      - name: Check for print macros in Module source
        run: |
          roots=(module/src)
          for source in packages/*/src; do
            [ ! -d "$source" ] || roots+=("$source")
          done
          status=0
          grep -rnE --include='*.rs' 'e?print(ln)?!' "${roots[@]}" || status=$?
          [ "$status" -eq 1 ]

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-spacetime
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-spacetime
      - run: cargo test -p lyracore-conformance -- --nocapture
      - run: cargo test -p lyracore-conformance --example scoreboard
      - run: cargo test -p lyracore-protocol --example benilla_inventory
      - run: cargo test -p lyracore-importer
      - run: cargo test -p lyracore-module --lib --features=debug_reducers
      - run: cargo test -p lyracore-module --test build_script
      - run: cargo test -p lyracore-module --test native_debug_gate
      - run: cargo test -p lyracore-module --test native_conformance
      - run: cargo test -p lyracore-module --test notification_tables
      - run: cargo test -p lyracore-module --test package_api_lint
      - run: cargo test -p lyracore-package-delta
      - run: cargo test -p lyracore-protocol
      - run: cargo test -p lyracore-shared
      - run: cargo test -p lyracore-test-support

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers

  official-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: packages-ref
        timeout-minutes: 2
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if paired=$(git ls-remote --exit-code --heads https://github.com/LyraCoreProject/packages "refs/heads/$BRANCH"); then
            echo "ref=${paired%%[[:space:]]*}" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: ${{ steps.packages-ref.outputs.ref }}
          path: official-packages
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the official Packages
        run: for package in official-packages/*/; do ln -s "$PWD/$package" packages/; done
      - run: cargo test -p lyracore-module --test package_api_lint
      - run: cargo check --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
