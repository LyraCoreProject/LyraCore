name: Rust

# The Rust gates from docs/danger-zones.md, verbatim, plus the wasm compile that only the
# deploy-time preflight covered before. Nothing here needs a SpacetimeDB node: the module tests that
# do are integration tests, and `--lib` leaves them out.
#
# rustup reads rust-toolchain.toml and installs the pinned toolchain, rustfmt, clippy and the
# wasm32-unknown-unknown target on the first cargo call, so nothing here repeats the version.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The SpacetimeDB build aborts on a print-family macro anywhere in Module source, even in a
      # comment or a test. Use `writeln!(std::io::stderr(), ...)` for a test diagnostic.
      - name: Check for print macros in Module source
        run: |
          roots=(module/src)
          for source in packages/*/src; do
            [ ! -d "$source" ] || roots+=("$source")
          done
          status=0
          grep -rnE --include='*.rs' 'e?print(ln)?!' "${roots[@]}" || status=$?
          [ "$status" -eq 1 ]

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One job, not four: the crates share a target directory, and a failed step names its crate.
      - run: cargo test -p lyracore-importer
      - run: cargo test -p lyracore-module --lib --features=debug_reducers
      - run: cargo test -p lyracore-gateway
      - run: cargo test -p lyracore-shared
      - run: cargo test -p lyracore-test-support

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `lyracore publish` builds this feature set. A default-feature check would omit published reducers.
      - run: cargo check --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers

  # A Core change that breaks an official Package fails here, before the Package's next publish.
  official-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A paired packages PR uses the same branch name; build against it when it exists.
      - id: packages-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/LyraCoreProject/packages "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: ${{ steps.packages-ref.outputs.ref }}
          path: official-packages
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the official Packages
        run: for package in official-packages/*/; do ln -s "$PWD/$package" packages/; done
      - run: cargo check --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
